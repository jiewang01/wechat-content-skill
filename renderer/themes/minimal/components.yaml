quote:
  background: "#fafafa"
  border_left: "2px solid #111111"
  border_radius: 0
  padding: 10
  margin_top: 18
  margin_bottom: 18
  text_color: "#3a3a3a"
  font_size: 15
  cite_color: "#8a8a8a"
  cite_size: 12

note:
  background: "#fafafa"
  border_left: "2px solid #8a8a8a"
  border_radius: 0
  padding: 10
  margin_top: 16
  margin_bottom: 16
  text_color: "#4a4a4a"
  font_size: 15

callout:
  base:
    border_radius: 0
    padding: 10
    margin_top: 16
    margin_bottom: 16
    font_size: 15
  variants:
    info:
      background: "#f5f5f5"
      border_left: "2px solid #666666"
      title_color: "#333333"
      text_color: "#4d4d4d"
    warning:
      background: "#f7f5f2"
      border_left: "2px solid #8a8a8a"
      title_color: "#5a5a5a"
      text_color: "#4d4d4d"
    tip:
      background: "#f6f6f6"
      border_left: "2px solid #333333"
      title_color: "#111111"
      text_color: "#4d4d4d"
    danger:
      background: "#f6f3f3"
      border_left: "2px solid #111111"
      title_color: "#000000"
      text_color: "#3d3d3d"

card:
  border: "1px solid #e5e5e5"
  border_radius: 4
  padding: 12
  margin_top: 16
  margin_bottom: 16
  background: "#fcfcfc"
  title_color: "#111111"
  title_size: 16
  title_weight: 600
  item_color: "#4a4a4a"
  item_size: 15
  item_margin: 6
  item_marker_color: "#111111"
  footer_color: "#9a9a9a"
  footer_size: 13

hr:
  color: "#e5e5e5"
  margin_top: 28
  margin_bottom: 28

figure:
  border: "1px dashed #8a8a8a"
  border_radius: 4
  padding: 12
  margin_top: 16
  margin_bottom: 16
  background: "#fafafa"
  label_color: "#8a8a8a"
  label_size: 12
  prompt_color: "#4a4a4a"
  prompt_size: 14
  line_height: 1.7
