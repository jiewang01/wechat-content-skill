body:
  font_size: 15
  line_height: 1.9
  color: "#1a1a1a"
  font_family: "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
  word_break: break-word

h1:
  font_size: 21
  font_weight: 600
  color: "#111111"
  margin_top: 28
  margin_bottom: 14

h2:
  font_size: 18
  font_weight: 600
  color: "#111111"
  margin_top: 24
  margin_bottom: 12

h3:
  font_size: 16
  font_weight: 600
  color: "#333333"
  margin_top: 20
  margin_bottom: 10

paragraph:
  margin_top: 12
  margin_bottom: 12

code_inline:
  font_family: "Consolas, 'Courier New', monospace"
  color: "#333333"
  background: "#f5f5f5"
  padding_h: 4
  padding_v: 2
  border_radius: 2

code_block:
  background: "#f5f5f5"
  color: "#333333"
  font_family: "Consolas, 'Courier New', monospace"
  font_size: 13
  line_height: 1.6
  padding: 12
  border_radius: 2
  white_space: pre-wrap

list:
  indent: 16
  item_margin: 6
  marker_color: "#111111"

image:
  width: "100%"
  max_width: "100%"
  margin_top: 20
  margin_bottom: 20
