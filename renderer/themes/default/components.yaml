quote:
  background: "#f7f7f7"
  border_left: "3px solid #07c160"
  border_radius: 4
  padding: 12
  margin_top: 16
  margin_bottom: 16
  text_color: "#555555"
  font_size: 15
  cite_color: "#888888"
  cite_size: 13

note:
  background: "#f0f7ff"
  border_left: "3px solid #1677ff"
  border_radius: 4
  padding: 12
  margin_top: 16
  margin_bottom: 16
  text_color: "#4a5568"
  font_size: 15

callout:
  base:
    border_radius: 4
    padding: 12
    margin_top: 16
    margin_bottom: 16
    font_size: 15
  variants:
    info:
      background: "#eef6ff"
      border_left: "3px solid #1677ff"
      title_color: "#1677ff"
      text_color: "#4a5568"
    warning:
      background: "#fff7e6"
      border_left: "3px solid #fa8c16"
      title_color: "#d46b08"
      text_color: "#6b4c1f"
    tip:
      background: "#f0fff4"
      border_left: "3px solid #07c160"
      title_color: "#07c160"
      text_color: "#3d6b4f"
    danger:
      background: "#fff1f0"
      border_left: "3px solid #f5222d"
      title_color: "#cf1322"
      text_color: "#7c2a26"

card:
  border: "1px solid #e8e8e8"
  border_radius: 8
  padding: 14
  margin_top: 16
  margin_bottom: 16
  background: "#fafafa"
  title_color: "#07c160"
  title_size: 16
  title_weight: 600
  item_color: "#4a5568"
  item_size: 15
  item_margin: 6
  item_marker_color: "#07c160"
  footer_color: "#999999"
  footer_size: 13

hr:
  style: bar
  color: "#07c160"
  width: 60
  height: 4
  border_radius: 2
  margin_top: 20
  margin_bottom: 20

figure:
  border: "1px dashed #07c160"
  border_radius: 8
  padding: 14
  margin_top: 16
  margin_bottom: 16
  background: "#f0f7ff"
  label_color: "#07c160"
  label_size: 12
  prompt_color: "#4a5568"
  prompt_size: 14
  line_height: 1.7
