body:
  font_size: 16
  line_height: 1.7
  color: "#1f2933"
  font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
  word_break: break-word
  letter_spacing: "0.3px"
  text_align: justify

strong:
  color: "#2563eb"

h1:
  font_size: 21
  font_weight: 700
  color: "#0f172a"
  margin_top: 24
  margin_bottom: 14
  text_align: center

h2:
  font_size: 19
  font_weight: 700
  color: "#2563eb"
  margin_top: 26
  margin_bottom: 14
  border_left: "5px solid #2563eb"
  padding_left: 12

h3:
  font_size: 17
  font_weight: 700
  color: "#334155"
  margin_top: 20
  margin_bottom: 10
  border_left: "3px solid #2563eb"
  padding_left: 10

paragraph:
  margin_top: 10
  margin_bottom: 10

code_inline:
  font_family: "'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace"
  color: "#2563eb"
  background: "#eef2f7"
  padding_h: 4
  padding_v: 2
  border_radius: 4

code_block:
  background: "#0d1117"
  color: "#e6edf3"
  font_family: "'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace"
  font_size: 13
  line_height: 1.65
  padding: 14
  border_radius: 6
  white_space: pre-wrap

list:
  indent: 16
  item_margin: 6
  marker_color: "#2563eb"

image:
  width: "100%"
  max_width: "100%"
  margin_top: 16
  margin_bottom: 16
