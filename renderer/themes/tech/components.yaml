quote:
  background: "#f0f5ff"
  border_left: "3px solid #2563eb"
  border_radius: 4
  padding: 12
  margin_top: 16
  margin_bottom: 16
  text_color: "#334155"
  font_size: 15
  cite_color: "#64748b"
  cite_size: 13

note:
  background: "#f8fafc"
  border_left: "3px solid #64748b"
  border_radius: 4
  padding: 12
  margin_top: 16
  margin_bottom: 16
  text_color: "#475569"
  font_size: 15

callout:
  base:
    border_radius: 4
    padding: 12
    margin_top: 16
    margin_bottom: 16
    font_size: 15
  variants:
    info:
      background: "#eff6ff"
      border_left: "3px solid #2563eb"
      title_color: "#1d4ed8"
      text_color: "#334155"
    warning:
      background: "#fffbeb"
      border_left: "3px solid #d97706"
      title_color: "#b45309"
      text_color: "#713f12"
    tip:
      background: "#ecfdf5"
      border_left: "3px solid #059669"
      title_color: "#047857"
      text_color: "#065f46"
    danger:
      background: "#fef2f2"
      border_left: "3px solid #dc2626"
      title_color: "#b91c1c"
      text_color: "#7f1d1d"

card:
  border: "1px solid #e2e8f0"
  border_radius: 6
  padding: 14
  margin_top: 16
  margin_bottom: 16
  background: "#f8fafc"
  title_color: "#2563eb"
  title_size: 15
  title_weight: 700
  item_color: "#475569"
  item_size: 15
  item_margin: 6
  item_marker_color: "#2563eb"
  footer_color: "#94a3b8"
  footer_size: 13

hr:
  style: bar
  color: "#2563eb"
  width: 72
  height: 3
  border_radius: 2
  margin_top: 20
  margin_bottom: 20

figure:
  border: "1px dashed #2563eb"
  border_radius: 6
  padding: 14
  margin_top: 16
  margin_bottom: 16
  background: "#f8fafc"
  label_color: "#2563eb"
  label_size: 12
  prompt_color: "#475569"
  prompt_size: 14
  line_height: 1.7
