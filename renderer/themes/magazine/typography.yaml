body:
  font_size: 16
  line_height: 1.75
  color: "#212529"
  font_family: "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
  word_break: break-word
  letter_spacing: "0.5px"
  text_align: justify

strong:
  color: "#d9480f"

h1:
  font_size: 24
  font_weight: 800
  color: "#1a1a1a"
  margin_top: 28
  margin_bottom: 16
  text_align: center
  letter_spacing: "2px"

h2:
  font_size: 21
  font_weight: 800
  color: "#d9480f"
  margin_top: 28
  margin_bottom: 14
  text_align: center
  letter_spacing: "2px"

h3:
  font_size: 17
  font_weight: 700
  color: "#c2410c"
  margin_top: 20
  margin_bottom: 10
  border_left: "3px solid #d9480f"
  padding_left: 10

paragraph:
  margin_top: 10
  margin_bottom: 10

code_inline:
  font_family: "Consolas, 'Courier New', monospace"
  color: "#c2410c"
  background: "#fdf3ec"
  padding_h: 4
  padding_v: 2
  border_radius: 4

code_block:
  background: "#2d2a26"
  color: "#f5efe8"
  font_family: "Consolas, 'Courier New', monospace"
  font_size: 14
  line_height: 1.6
  padding: 14
  border_radius: 8
  white_space: pre-wrap

list:
  indent: 16
  item_margin: 6
  marker_color: "#d9480f"

image:
  width: "100%"
  max_width: "100%"
  margin_top: 18
  margin_bottom: 18
