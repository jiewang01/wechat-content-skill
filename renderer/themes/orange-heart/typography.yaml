body:
  font_size: 16
  line_height: 1.8
  color: "#333333"
  font_family: "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
  word_break: break-word
  letter_spacing: "0.5px"
  text_align: justify

strong:
  color: "#d94a38"
  background: "#fdf0ee"
  padding: "0 4px"
  border_radius: 3

h1:
  font_size: 22
  font_weight: 600
  color: "#ef7060"
  margin_top: 24
  margin_bottom: 16
  text_align: center
  letter_spacing: "1px"

h2:
  font_size: 20
  font_weight: 700
  color: "#ef7060"
  margin_top: 26
  margin_bottom: 14
  border_left: "4px solid #ef7060"
  padding_left: 12

h3:
  font_size: 17
  font_weight: 700
  color: "#ef7060"
  margin_top: 20
  margin_bottom: 10
  border_left: "3px solid #ef7060"
  padding_left: 10

paragraph:
  margin_top: 14
  margin_bottom: 14

code_inline:
  font_family: "Consolas, 'Courier New', monospace"
  color: "#e05a45"
  background: "#fff5f3"
  padding_h: 6
  padding_v: 2
  border_radius: 4

code_block:
  background: "#2d2a26"
  color: "#f8efe8"
  font_family: "Consolas, 'Courier New', monospace"
  font_size: 14
  line_height: 1.6
  padding: 14
  border_radius: 8
  white_space: pre-wrap

list:
  indent: 16
  item_margin: 6
  marker_color: "#ef7060"
  marker_weight: 700

image:
  width: "100%"
  max_width: "100%"
  margin_top: 16
  margin_bottom: 16
  border_radius: 8
