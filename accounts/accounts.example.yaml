# 多账号配置示例（蓝图十四章，计划 M5-T7）。
#
# 硬性规则（蓝图十四章「不要把 Token 放进 YAML」）：
# 1. YAML 只写环境变量名，绝不落真实 secret；
# 2. 真实 secret 存放于 Environment / Secret Manager；
# 3. 每个文件一个账号，文件名即账号 ID；复制本文件为 account-a.yaml 后
#    只需替换 name 与 env 引用的变量名。
#
# 本地开发（值为占位说明，不生效）：
#   export WECHAT_APP_ID_A=<你的 AppID>
#   export WECHAT_APP_SECRET_A=<你的 AppSecret>

name: Tech Account
description: 技术主号（示例配置）

env:
  app_id: WECHAT_APP_ID_A
  app_secret: WECHAT_APP_SECRET_A
