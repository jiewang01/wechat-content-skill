[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-content-skill"
version = "0.1.0"
description = "Agent-native content operating system for WeChat Official Accounts: research, write, humanize, render, validate, publish-as-draft."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "wechat-content-skill contributors" }]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["core*", "renderer*", "validators*", "integrations*", "skills*"]

[tool.setuptools.package-data]
"renderer.themes" = ["*/theme.yaml", "*/typography.yaml", "*/components.yaml"]
"skills.content.humanize" = ["rules.yaml"]
"validators.content" = ["rules/*.yaml"]
"validators.wechat" = ["rules/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
