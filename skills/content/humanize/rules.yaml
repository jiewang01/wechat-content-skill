# Humanize 检测规则 —— 硬约束 H7：规则外置为配置，调整规则不需要改代码
# v2（v0.3）：新增 connectives 清单与三个节奏维度（connective_density /
#   opening_monotony / sentence_length_uniformity，共用 CJK≥150 字且句数≥6 的门限，
#   短文豁免防误伤）；黑名单与成对句式按 v0.2 观察扩充；旧字段不删不改。
version: 2
pass_score: 60

penalties:
  phrase: 8
  paired_phrase: 8
  long_sentence: 3
  avg_sentence_length: 5
  long_paragraph: 3
  repetition: 5
  connective_density: 3
  opening_monotony: 3
  sentence_length_uniformity: 3

limits:
  max_sentence_chars: 60
  avg_sentence_chars: 35
  max_paragraph_chars: 200
  repeat_ngram_chars: 5
  repeat_min_occurrences: 3
  min_sentences_for_avg: 3
  max_connectives_per_kilo: 12
  min_chars_for_rhythm: 150
  min_sentences_for_rhythm: 6
  max_repeated_opening_run: 3
  min_sentence_length_std: 3.5

phrases:
  - "首先，"
  - "其次，"
  - "最后，"
  - "再者，"
  - "值得注意的是"
  - "值得一提的是"
  - "在当今"
  - "在如今"
  - "总而言之"
  - "综上所述"
  - "众所周知"
  - "日新月异"
  - "信息爆炸"
  - "飞速发展"
  - "迅猛发展"
  - "赋能"
  - "抓手"
  - "闭环"
  - "底层逻辑"
  - "不难发现"
  - "由此可见"
  - "毫无疑问"
  - "让我们"
  - "不得不说"
  - "毋庸置疑"
  - "显而易见"
  - "不言而喻"
  - "归根结底"
  - "与此同时"
  - "换句话说"
  - "换言之"
  - "总的来说"

pairs:
  - ["不仅", "而且"]
  - ["随着", "的发展"]
  - ["在这个", "的时代"]
  - ["扮演着", "角色"]
  - ["一方面", "另一方面"]

connectives:
  - "但是"
  - "然而"
  - "因此"
  - "所以"
  - "同时"
  - "此外"
  - "另外"
  - "并且"
  - "不过"
  - "其实"
  - "当然"
  - "事实上"
  - "实际上"
