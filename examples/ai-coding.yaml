  account:
    positioning: 分享 AI Coding 实践，帮助程序员提升研发效率
    audience: 使用 AI Coding 工具的工程师、团队技术负责人
    value_proposition: [把 AI Coding 工具可靠地接入日常研发流程, 解决「用了 AI 却变慢/产出不可控」的工程问题]
  selected_topic:
    topic: Agent 上下文治理实践
    angle: 从可观测的上下文污染讲起，给出治理清单
    why_selected:
      market_reason: 需求与痛点双高，现有内容停留在概念层，缺少系统性治理方法
      audience_reason: 核心读者的直接痛点
      account_reason: 账号「工程落地」定位的强匹配项
      differentiation_reason: 从机制讲治理，占据内容空白
    confidence: high
  target_reader: 深度使用 AI Coding 工具 3 个月以上、发现 agent 会话越长越不可控的中高级工程师
  pain_points:
    functional: agent 无法稳定完成长链路任务，做一半就跑偏
    efficiency: 反复重述上下文、重开会话，等效于重复劳动
    cognitive: 不知道为什么输出越来越差，只能靠玄学调 prompt
    risk: 担心 token 成本失控、代码被悄悄改错而不自知
    emotional: 挫败感与「是不是我不会用」的自我怀疑
  core_insight:
    misconception: 大多数人认为输出质量下降是模型能力问题，解法是换更强的模型或写更好的 prompt
    evidence: ["会话越长，上下文中的噪声与冲突规则越多（示例占位 evidence）", "已有内容集中在 Context Window 概念层，缺乏工程治理视角（research 结论）"]
    insight: 真正的问题是上下文管理——把「模型看不全、看不准、规则互相打架」治理好，比换模型更有效
  key_arguments:
    - 上下文不是纯长度问题，是污染与冲突问题
    - 治理的关键是「可观测」：先知道上下文里是什么
    - 用分层策略（固化规则 / 压缩摘要 / 外置记忆）管理不同内容
    - 效果可以量化：定义退化指标做回归测试
  title_candidates:
    - "你的 Agent 不是变笨了，是上下文被污染了"
    - "Context Engineering 实战：把越用越笨的 Agent 救回来"
    - "为什么你的 AI 编码助手越用越不可靠？"
    - "我治理 Agent 上下文的 5 个步骤（附检查清单）"
    - "换更强的模型前，先治理上下文"
  outline:
    - section: Hook
      purpose: 让读者意识到「不是我一个人遇到」
      key_points: [复现一个典型场景：会话开始很聪明，50 轮后开始遗忘指令]
      notes: 用读者能立刻对号入座的描述
    - section: Problem
      purpose: 说明这是个影响面广泛的工程问题
      key_points: [长任务必用 agent，输出退化导致返工, 成本与信任双损]
    - section: Misconception
      purpose: 破除「换模型/调 prompt」的直觉解法
      key_points: [模型能力不是瓶颈, prompt 只是表层]
    - section: Core Insight
