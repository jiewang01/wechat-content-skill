# ============================================================
# 端到端示例：AI Coding 账号（ILLUSTRATIVE）
# 
# 输入：账号简介 "分享 AI Coding 实践，帮助程序员提升研发效率"
# 口径：plan/plan.md §21 MVP 验收示例
#
# 重要说明：本文件演示**整条链路的期望输出形态**，用于验收与冒烟测试。
# 所有 evidence 均为示例占位（source 标注"示例占位"、date: unknown、
# confidence: low），真实运行必须由 Stage 2 检索获得，
# 来源 / 日期 / 置信度以实际检索结果为准（见 policies/evidence-policy.md）。
# 示例中的边界 / 推断字段标注 [inferred]，与 profile-parser 约定一致。
# ============================================================

# ------------------------------------------------------------
# Stage 1 输出
# ------------------------------------------------------------
account_profile:
  description: 分享 AI Coding 实践，帮助程序员提升研发效率
  source: explicit
  audience:
    primary: ["使用 AI Coding 工具的工程师", "团队技术负责人"]
    secondary: ["前端/后端/全栈开发者"]
  domain: ["AI Coding", "Agent 工程", "研发效率"]
  value_proposition:
    - 把 AI Coding 工具可靠地接入日常研发流程
    - 解决「用了 AI 却变慢 / 产出不可控」的工程问题
  content_style:
    tone: "实战向、工程视角 [inferred]"
    format: ["长文 [inferred]", "案例复盘 [inferred]", "踩坑记录 [inferred]"]
  authority:
    strengths: ["一线研发经验", "AI Coding 工具深度使用"]
    limitations: ["非官方培训讲师 / 非学术机构身份"]
  boundaries:
    - 泛 AI 新闻评论（不涉及研发落地）
    - 与研发无关的社会热点
    - 模型能力排名 / 评测榜单
  platform: unknown
  constraints: []

# ------------------------------------------------------------
# Stage 2 输出（6 条 findings，示例精简）
# ------------------------------------------------------------
research_findings:
  - topic: Agent 长时间运行后输出质量退化
    signals:
      trend: Context Engineering 成为新关注点
      demand: 用户报告 agent 会话越长越健忘、越不可控
      discussion: 高发提问「我的 agent 是不是越用越笨」
    evidence:
      - source: 示例占位（社区讨论）
        source_type: discussion
        date: unknown
        claim: 存在大量「会话变长后输出质量下降」的用户反馈（示例）
        confidence: low
    existing_content:
      saturation: medium
      summary: 已有大量「Context Window 是什么」的入门内容
    content_gap: 为什么变差、工程上如何治理上下文，缺乏系统性解释
    candidate_angles: [上下文治理方法论, 上下文污染机制解释]
  - topic: Prompt / 指令漂移
    signals:
      trend: 长会话遗忘指令的讨论增多
      demand: 用户想让它一直按初始规则执行
    evidence:
      - source: 示例占位
        source_type: discussion
        date: unknown
        claim: 指令在长对话中被遗忘是高频痛点（示例）
        confidence: low
    existing_content:
      saturation: low
    content_gap: 指令漂移的机制与缓解路径
    candidate_angles: [漂移机制, 指令固化清单]
  - topic: 代码上下文与仓库检索
    signals:
      trend: 仓库级索引/检索成为工具标配
      demand: 大仓库里 AI 找不到文件、改错模块
    evidence:
      - source: 示例占位（产品文档）
        source_type: product
        date: unknown
        claim: 主流工具均提供仓库索引能力（示例）
        confidence: low
    existing_content:
      saturation: medium
    content_gap: 检索质量如何影响生成质量的系统比较
    candidate_angles: [索引配置实践, 检索策略对比]
  - topic: MCP 与工具调用落地
    signals:
      trend: MCP 生态快速扩张
      demand: 接入各种服务时失败率高
    evidence:
      - source: 示例占位（社区）
        source_type: community
        date: unknown
        claim: 工具接入类报错与踩坑分享数量上升（示例）
        confidence: low
    existing_content:
      saturation: medium
    content_gap: 工程化接入清单（权限/限流/安全）
    candidate_angles: [接入踩坑清单, 工具权限最小化]
  - topic: AI 生成代码的安全与审计
    signals:
      trend: 生成代码正式进入生产
      demand: 担心漏洞、许可证、过度信任
    evidence:
      - source: 示例占位（安全社区）
        source_type: community
        date: unknown
        claim: 生成代码安全问题被持续讨论（示例）
        confidence: low
    existing_content:
      saturation: medium
    content_gap: 可落地的审计清单而非泛泛的「要小心」
    candidate_angles: [审计清单, 风险分级]
  - topic: 团队级 AI Coding 推广
    signals:
      trend: 企业强制/鼓励使用
      demand: 管理者关心 ROI、一致性、组织阻力
    evidence:
      - source: 示例占位（行业报告）
        source_type: analytics
        date: unknown
        claim: 企业级 AI 编程采用率上升（示例）
        confidence: low
    existing_content:
      saturation: low
    content_gap: 从工具到流程的组织落地经验
    candidate_angles: [SOP 制定, 从个人到团队]

