article_brief:
  account: { positioning: 用 Python 讲清机器学习原理，入门与 Kaggle 实践, audience: 入门者/算法学习者, value_proposition: [原理讲清, 实践路径] }
  selected_topic: { topic: 学 ML 的正确顺序：打破四个直觉, angle: 反直觉顺序论, confidence: high }
  target_reader: 刚起步/卡在半路的数据科学自学者与转行者
  pain_points: { functional: 学了几个月做不出完整项目, efficiency: 教程与路线图互相矛盾浪费时间, cognitive: 不知道该先啃数学还是先写代码, emotional: 自我怀疑「是不是我不适合」 }
  core_insight:
    misconception: Mainstream 认知=先学完数学→再学框架→最后才动手
    evidence: ["Python 只需子集即可进入数据栈，无需完整语言（AIJobsGate 2026-05-23）", "80% 应用工作用 scikit-learn 或更简单（AITutorCode 2026-06-09）", "tool-hopping 6 个月仍不会搭项目（InterviewQuery 2026-04-23）"]
    insight: 正确的顺序是「工具最小集 + 数学并修 + 先经典后深度 + 项目验收」；先动手跑通端到端，再回头补理论
  key_arguments: [数学是并修不是前置, 工具控制在五件以内, 先 scikit-learn 后深度学习, 用项目验收代替教程计数]
  title_candidates: ["学机器学习，90% 的人顺序都错了", "别先啃完数学：ML 入门的正确顺序", "5 个库 + 1 个项目：数据科学真正的最小集", "学了 6 个月还是不会做项目？"]
  outline:
    - { section: Hook, purpose: 复现学习者真实停滞, key_points: [Reddit 6 个月 tool-hopping 案例, 「学到哪了」的困惑] }
    - { section: Problem, purpose: 指出路径噪音普遍性, key_points: [每周都有新工具/新路线图, 矛盾建议互相冲突] }
    - { section: Misconception, purpose: 破除四个直觉, key_points: [数学前置, 先学深度学习, 工具要全, 教程=进度] }
    - { section: Core Insight, purpose: 提出并修与最小集, key_points: [数学+代码并修, 五件套工具箱] }
    - { section: Mechanism, purpose: 讲清为什么这些直觉是错的, key_points: [80% 工作用 sklearn, 广度≠进步] }
    - { section: Solution, purpose: 给出 12 个月最小路线, key_points: [Python 子集→数据栈→sklearn→经典项目, 每阶段 1 个验收标准] }
    - { section: Example, purpose: 一个成功学习者路径, key_points: [从分析岗位转行的案例, 项目讲清楚才叫会] }
    - { section: Action, purpose: 今天开始的三步, key_points: [砍掉工具清单, 选第一个数据集, 两周内跑通首个模型] }
