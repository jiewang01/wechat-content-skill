# 冒烟测试结果：tech-04（机器学习入门账号）
# 输入："用 Python 讲清机器学习原理，数据科学入门与 Kaggle 实践笔记"
# 日期：2026-09-18 ｜ Stage 2 为真实检索，evidence 可溯源
# 记录形态：紧凑评估记录

account_profile:
  description: 用 Python 讲清机器学习原理，数据科学入门与 Kaggle 实践笔记
  source: explicit
  audience: { primary: [数据科学入门者, 算法学习者], secondary: [转行学习者] }
  domain: [机器学习原理, 数据科学, Python, Kaggle]
  value_proposition: [把原理讲清, 给可上手的实践路径]
  content_style: { tone: 「循序渐进、原理+代码 〔inferred〕」, format: [教程, 笔记, Kaggle 复盘] }
  authority:
    strengths: [Python/ML 教学视角, Kaggle 实践]
    limitations: [非研究机构/非企业算法团队官方]
  boundaries: [底层硬核计算框架源码, 纯工程运维, 模型鄙视链争论]
  platform: unknown
  constraints: []

research_findings:
  - topic: 入门路径噪音大：学什么、按什么顺序
    signals: { trend: 2026 学习路线强调「数学与代码并行、别先啃完数学」, demand: 新手最常见的困惑是顺序与取舍 }
    evidence:
      - source: AIJobsGate（2026 Python for ML 指南）
        source_type: other
        date: 2026-05-23
        claim: 明确 Python 只需子集（变量/控制流/函数/IO/基础 OOP），无需元类装饰器等进阶话题即可进入数据栈
        confidence: medium
      - source: Scaler（2026 ML Roadmap）
        source_type: other
        date: 2026-08-12
        claim: 12 个月路线：Python 与数学基础→数据处理→核心算法→深度学习→部署/MLOps→项目→LLM 与持续学习
        confidence: medium
    content_gap: 把"别踩哪些坑"与"先学哪个工具"讲清楚的中文系统内容
    candidate_angles: [学习顺序反直觉点, 工具最小集]

  - topic: 常见失败模式：工具跳来跳去与数学前置
    signals: { demand: 学了很久没产出、怀疑自己 }
    evidence:
      - source: InterviewQuery（2026 转行路线）
        source_type: other
        date: 2026-04-23
        claim: 典型误区：Reddit 用户花 6 个月"tool-hopping"（学完几十个教程）仍无法搭建项目；广度≠进步
        confidence: medium
      - source: AITutorCode（career changers 指南）
        source_type: other
        date: 2026-06-09
        claim: 80% 的应用数据科学工作用 scikit-learn 或更简单；把数学当前置而非同步会无限推迟学习
        confidence: medium
    content_gap: 用真实失败案例讲'怎么学'而非'学什么'的内容
    candidate_angles: [tool-hopping 戒断, 数学是并修不是前置]

  - topic: GenAI/LLM 进入核心课程
    signals: { trend: 雇主期望加入 RAG/提示工程/预训练模型, demand: 新手怕「学传统 ML 还有用吗」 }
    evidence:
      - source: Axiora（2026 路线）
        source_type: other
        date: 2026-06-23
        claim: GenAI 已成核心课程一部分；但基础（Python/统计/线性代数/模型如何学习）没有变，工具会变、基础会复利
        confidence: medium
    content_gap: 把"传统 ML 与生成式 AI"讲成连续谱而非替代关系的内容
    candidate_angles: [传统 ML 与 LLM 的分工, 基础复利论]

  - topic: Kaggle 实践与学习者焦虑
    signals: { demand: 做了很多 notebook 却面试不过, discussion: 用案例来检验学习而非堆教程 }
    evidence:
      - source: MentorCruise（转行咨询）
        source_type: other
        date: 2026-01-01
        claim: 转行失败最常卡在"证书收集"模式：没人确认你准备好；需要里程碑式验收（能从头到尾讲清一个端到端项目）
        confidence: low
    content_gap: 用"能独立讲清项目"替代"收集证书/教程"的验收方法
    candidate_angles: [里程碑验收法, 面试式自查]

