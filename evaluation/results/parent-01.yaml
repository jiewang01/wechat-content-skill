# 冒烟测试结果：parent-01（科学育儿账号）
# 输入：evaluation/evaluation-dataset.yaml -> parent-01.account_brief
# "科学育儿与儿童心理学，关注 0-6 岁早期教育与亲子关系"
# 日期：2026-09-18（Stage 2 检索为真实结果，evidence 可溯源）
# 执行器：SKILL.md + prompts/*（按调用顺序）
# ============================================================

# ------------------------------------------------------------
# Stage 1 — Positioning Analysis（prompts/profile-parser.md）
# ------------------------------------------------------------
account_profile:
  description: 科学育儿与儿童心理学，关注 0-6 岁早期教育与亲子关系
  source: explicit
  audience:
    primary: ["0-6 岁孩子的家长", "学龄前儿童父母"]
    secondary: ["准父母", "隔代养育中的祖辈 〔inferred〕"]
  domain: ["科学育儿", "儿童心理学", "早期教育", "亲子关系"]
  value_proposition:
    - 用儿童心理学的依据解释孩子行为背后的原因
    - 给出家长当下可执行、可坚持的具体互动方法
  content_style:
    tone: "理性、共情、去焦虑 〔inferred〕"
    format: ["长文", "图文", "案例式讲解 〔inferred〕"]
  authority:
    strengths: ["儿童发展心理学的知识框架", "面向 0-6 岁阶段的专业视野"]
    limitations: ["非儿科医生 / 非临床心理治疗师身份（无法提供医疗/诊断建议）"]
  boundaries:
    - 医学诊断、用药与治疗建议（身份边界）
    - 泛教育政策解读与择校博弈类话题（超出专业知识域）
    - 贩卖焦虑的“神童/鸡娃”内容
  platform: unknown
  constraints: []

# ------------------------------------------------------------
# Stage 2 — Research（prompts/research.md，真实检索 2026-09-18）
# ------------------------------------------------------------
research_findings:
  - topic: 「电子带娃」：屏幕时间之争
    signals:
      trend: 2026-05 教育部启动全国学前教育宣传月（主题“共同守护数字时代的童年”），“电子带娃”成社会热议；多地倡议数字产品使用底线
      demand: 家长普遍“哄不住”，真实困境是双职工/隔代养育下精力不足
      discussion: “总看屏幕不好但太累了”“不给就哭”是高频自白
    evidence:
      - source: 央视新闻（教育部宣传月启动仪式报道）
        source_type: news
        date: 2026-05-19
        claim: 教育部启动 2026 全国学前教育宣传月，提醒防范“电子带娃”，要求幼儿园不得以数字产品替代图画书、玩具
        confidence: high
      - source: 人民日报海外版（经央广网转载）
        source_type: news
        date: 2026-08-03
        claim: “电子带娃”成为不少家庭育儿常态，专家指出屏幕专注多为“假性专注”
        confidence: high
      - source: 湖南省教育厅公开信（教育部官网转载）
        source_type: official_doc
        date: 2026-05-28
        claim: 倡议 3 岁以下婴幼儿禁用手机/平板等数字产品，3-6 岁非必要不使用
        confidence: high
    existing_content:
      saturation: medium
      summary: 官方倡议与警示类内容密集，但多为“要不要禁”的表态
    content_gap: 从“禁止/放任”两极化走向“理解机制 + 家庭可执行的替代陪伴方案”的中间路线内容缺乏
    candidate_angles: [假性专注机制, 替代陪伴方案, 规则制定了守不住怎么办]

  - topic: 幼小衔接焦虑
    signals:
      trend: 每年 7-8 月机构借“不抢跑就落后”贩卖焦虑，官方连续发声“零起点教学”
      demand: 家长高频问题：要不要报衔接班、识字量够不够、会不会跟不上
      discussion: 社交平台上“同事家娃已会 100 以内加减法”类比较帖引发焦虑
    evidence:
      - source: 央视新闻
        source_type: news
        date: 2026-08-16
        claim: 北京海淀摸底调研：65% 新生入学前进行过拼音/识字/算术超前培训，95% 教师明确反对超前报班
        confidence: high
      - source: 北京日报（北京市政府门户转载）
        source_type: news
        date: 2026-08-23
        claim: “不抢跑就落后”说法流行，教育者普遍认为衔接核心是学习品质而非学科知识；超前学习可能透支求知欲
        confidence: medium
      - source: 教育部基础教育教学指导委员会致一年级新生家长信
        source_type: official_doc
        date: 2026-08-03
        claim: 明确“小学一年级全面实行零起点教学”，建议家长重心放在生活自理、心理调节、习惯养成
        confidence: high
    existing_content:
      saturation: high
      summary: 官方文章与家长经验帖都很多，但家长仍被机构话术裹挟，说明理性内容未触达决策场景
    content_gap: 有数据、有机制解释、并给出“不抢跑也不会落后”的具体行动清单的深度内容稀缺
    candidate_angles: [用数据回应要不要提前学, 入学前 4 项准备的家庭版清单]

  - topic: 儿童情绪管理与“发脾气”
    signals:
      trend: 3-6 岁被反复确认为情绪认知与调节关键期
      demand: 家长高频问题：孩子哭闹/摔东西/“窝里横”怎么办，讲道理没用
      discussion: “先接住情绪再处理问题”“给情绪起名字”等具体方法被广泛传播
    evidence:
      - source: 四川省卫生健康委妇幼保健专栏
        source_type: official_doc
        date: 2026-08-14
        claim: 儿童情绪失控背后是未被看见的需求；建议先接纳情绪、用“我”开头沟通、每天 15 分钟只听不说
        confidence: medium
      - source: 央广网
        source_type: news
        date: 2026-08-24
        claim: 儿童情绪能力从家庭互动中习得，3-6 岁是情绪认知与调节能力关键期；“禁止情绪”型家庭易养出压抑型孩子
        confidence: high
    existing_content:
      saturation: high
      summary: 方法论内容多但碎片化，观点相互打架（要不要安抚 vs 要不要立规矩）
    content_gap: 把“接纳情绪不等于纵容行为”讲透、给出分年龄段做法的内容缺乏
    candidate_angles: [接纳情绪≠纵容行为, 情绪命名法实操]

  - topic: 未成年人网络新规（政策趋势）
    signals:
      trend: 国家网信办昨日发布未成年人健康使用网络规定（征求意见稿），强化“未成年人模式”、分类分层管理
      demand: 家长关心：规定对家庭管教/屏幕时间意味着什么
    evidence:
      - source: 国家互联网信息办公室发布（专家解读通稿）
        source_type: news
        date: 2026-09-18
        claim: 《国务院关于保障未成年人健康安全使用网络的规定（征求意见稿）》发布征求社会意见，聚焦未成年人用户识别、内容审核、算法管理、未成年人模式建设
        confidence: high
    existing_content:
      saturation: low
      summary: 解读多为转载通稿
    content_gap: 面向 0-6 岁家长的“这条政策对你的家庭意味着什么”视角内容缺失
    candidate_angles: [新规对学龄前家庭的 3 个影响]

  - topic: 专注力的“假性专注”误读
    signals:
      demand: 家长误把“看屏幕一动不动”当专注力强
    evidence:
      - source: 人民日报海外版（“电子带娃”报道）
        source_type: news
        date: 2026-08-03
        claim: 专家指出：屏幕引起的是由外部刺激驱动的“假性专注”，真正的专注需主动思考，可支撑深度阅读等长期活动
        confidence: high
    existing_content:
      saturation: low
      summary: 观点散落在屏幕话题中，少有人把它作为独立主题讲透
    content_gap: 从注意力机制讲“假性专注”并给家庭训练清单的内容缺失
    candidate_angles: [假性专注来解释为什么不专注, 专注力家庭训练清单]

