research_findings:
  - topic: 为什么我们舍不得扔：断舍离的心理机制
    signals: { demand: 「知道该扔却下不了手」是最高频卡点 }
    evidence:
      - source: 光明网（年底断舍离大扫除·无痛版）
        source_type: news
        date: 2026-02-09
        claim: 断舍离难源于三个心理效应：厌恶损失（失去痛苦约为获得的两倍）、禀赋效应（拥有的会被高估）、沉没成本（不舍已付出的成本）
        confidence: high
      - source: 光明网引《人格与社会心理学通报》研究
        source_type: analytics
        date: 2026-02-09
        claim: 30 对夫妻皮质醇研究：描述家为"杂乱"的人全天皮质醇偏高、抑郁情绪上升；杂乱环境会被大脑解读为慢性低度威胁
        confidence: medium
    content_gap: 把"为什么难扔"讲成心理学机制，并给出对治方法的内容
    candidate_angles: [三个心理效应对治, 杂乱压力说]

  - topic: 收纳方法谱系：四箱法/怦然心动/一进一出
    signals: { demand: 方法很多不知选哪个 }
    evidence:
      - source: DeclutterNow（2026 断舍离方法）
        source_type: other
        date: 2026-01-30
        claim: 四箱法（Keep/Donate/Relocate/Trash）+ 一进一出规则 + 30 天等待期，用于打破决策瘫痪
        confidence: medium
      - source: HomeStyle & Beyond
        source_type: other
        date: 2026-04-13
        claim: 每日 15 分钟整理优于一次性大扫除；"一天一小步"比追求完美的囤积清空更持久
        confidence: medium
    content_gap: 按"启动-断舍离-维持"三阶段选择方法的向导
    candidate_angles: [四箱法实操, 15 分钟日常整理]

  - topic: 收纳的悖论：收纳工具本身成为新杂物
    signals: { trend: 买收纳工具上瘾反增乱, discussion: 「花 11 万请人收拾 300 平」案例引热议 }
    evidence:
      - source: 搜狐（上海 300 平收纳案例）
        source_type: news
        date: 2026-09-06
        claim: 案例：十年囤货养成"仓库迷宫"，清出 7 车杂物；收纳团队诊断"不是懒，是舍不得断舍离"；此前越买收纳工具越乱
        confidence: medium
    content_gap: 先减量再收纳（没减少之前别买收纳工具）的纠偏内容
    candidate_angles: [收纳工具上瘾戒断, 先清空再收纳]

