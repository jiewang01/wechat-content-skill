article_brief:
  account: { positioning: 个人 IP 打造与自媒体运营，普通人内容创业路径, audience: 创作者/副业者, value_proposition: [可执行路径, 增长实操] }
  selected_topic: { topic: 纯 AI 内容为什么不行了, angle: 数据真相 + 人机分工, confidence: high }
  target_reader: 正考虑用 AI 批量产内容"省力起飞"的个人创作者
  pain_points: { efficiency: 一人产能有限想走捷径, cognitive: 分不清 AI 提效与 AI 替代, risk: 用错方法被限流/掉粉, emotional: 「不追 AI 是不是就落后」的焦虑 }
  core_insight:
    misconception: 大多数创作者以为"AI 生成得越多越好"，把产量当增长
    evidence: ["纯人类内容流量是纯 AI 的 5.44 倍、纯 AI 3 秒划走率 73%（新浪看点 2026-08-09）", "平台对非真人自动化与低质 AI 内容专项治理", "84% 创作者已用 AI 做脏活"]
    insight: 失效的不是"用 AI"，而是"只有 AI"；平台算法与用户都要"活人感"——AI 该当放大器，价值内核仍来自人
  key_arguments: [纯 AI 内容有数据劣势, 平台治理收紧了自动化红线, 人机分工保住"活人感", 观点/共鸣是复利资产]
  title_candidates: ["纯 AI 内容为什么不行了", "AI 让你快 10 倍，也让你死 10 倍", "内容创业的护城河：活人感", "别用 AI 省掉你最值钱的部分"]
  outline:
    - { section: Hook, purpose: 用反差数据开场, key_points: [5.44 倍流量差距, 3 秒划走 73%] }
    - { section: Problem, purpose: 说明批量生产的诱惑与陷阱, key_points: [单人想走捷径, 平台治理收紧] }
    - { section: Misconception, purpose: 破除「AI 越多越好」, key_points: [产能≠价值, 同质化加速] }
    - { section: Core Insight, purpose: 提出「人机分工」模型, key_points: [AI 干脏活, 人供观点与共鸣] }
    - { section: Mechanism, purpose: 讲平台与用户为何偏爱真人, key_points: [算法要互动, 用户要信任] }
    - { section: Solution, purpose: 分工清单, key_points: [草稿/剪辑/数据交 AI, 经历/观点/语气留人] }
    - { section: Example, purpose: 正反对照, key_points: [纯 AI 号 vs 人机协作号的增长对比] }
    - { section: Action, purpose: 本周可做, key_points: [列出可自动化环节, 建立个人观点母题, 下一期带「活人感」重做] }
  evidence:
    - { source: 新浪看点, source_type: community, date: 2026-08-09, claim: 纯人类流量 5.44 倍、3 秒划走 73%、84% 用 AI, confidence: medium }
    - { source: DuckDBLab, source_type: other, date: 2026-06-26, claim: AI 使一人达成团队产能；核心是共鸣与变现认知, confidence: medium }