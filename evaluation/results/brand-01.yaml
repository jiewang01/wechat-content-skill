# 记录形态：紧凑评估记录

account_profile:
  description: 个人 IP 打造与自媒体运营，普通人的内容创业路径
  source: explicit
  audience: { primary: [内容创作者, 想做副业的打工人], secondary: [自媒体新手] }
  domain: [个人 IP, 自媒体运营, 内容创业, 变现]
  value_proposition: [可执行路径, 增长实操]
  content_style: { tone: 「务实、个体视角 〔inferred〕」, format: [复盘, 方法清单, 数据拆解] }
  authority:
    strengths: [内容创作与账号运营经验, 中小体量增长方法论]
    limitations: [非 MCN/平台官方, 无法保证收益]
  boundaries: [时政评论, 金融投资建议, 灰色变现手段]
  platform: unknown
  constraints: []

research_findings:
  - topic: 人机协同成为 2026 内容创业分水岭
    signals: { trend: 「AI+人」取代「纯 AI 或纯人」的二元叙事, demand: 创作者既怕被 AI 取代又怕不用 AI 落后 }
    evidence:
      - source: 新浪看点（2026 自媒体逆势增长赛道）
        source_type: community
        date: 2026-08-09
        claim: 84% 创作者已将 AI 用于文案/剪辑；纯人类内容流量是纯 AI 内容 5.44 倍，纯 AI 内容 3 秒划走率超 73%；"活人感"是 AI 无法复制的护城河
        confidence: medium
      - source: DuckDBLab（AI 个人品牌副业指南）
        source_type: other
        date: 2026-06-26
        claim: AI 让单人即可做团队的事（AI 写稿/出图/视频/分析）；成功核心从"会写会设计"变成"知道什么内容能共鸣+如何变现"
        confidence: medium
    content_gap: 不空谈"人味"，给出"AI 干脏活、人出观点"的具体分工
    candidate_angles: [人机分工清单, 纯 AI 内容失效真相]

  - topic: 从流量扩张到价值沉淀
    signals: { trend: 平台治理非真人/低质 AI 内容，纯信息差搬运失效, demand: 创作者迷茫「红利期是否已过」 }
    evidence:
      - source: 新浪看点（同一篇）
        source_type: community
        date: 2026-08-09
        claim: 自媒体进入"价值沉淀"阶段；微信/小红书对非真人自动化与低质 AI 内容专项治理；四个逆势赛道：深度内容IP/AI垂直服务/本地生活/情绪疗愈
        confidence: medium
    content_gap: 红利期已过的焦虑之下，什么赛道仍可做 + 如何从钱的流向倒推定位
    candidate_angles: [四大赛道对照, 从钱的流向倒推]

  - topic: 内容经济的数据真相
    signals: { demand: 创作者想知道「哪个赛道赚钱、赚多少」 }
    evidence:
      - source: Fourthwall（2026 创作者获利赛道）
        source_type: other
        date: 2026-06-29
        claim: 个人理财 CPM $15-22 居首（联盟/广告变现强）；利基选择四步法（热情×需求×窄化×竞品研究）
        confidence: medium
      - source: AI 短剧从业者报道（红星新闻）
        source_type: news
        date: 2026-08-01
        claim: 上半年各平台上线微短剧 36.7 万部，AI 新剧占比超 74%；抖音端原生 AI 剧 98.7% 处于盈亏线以下（DataEye）
        confidence: medium
    content_gap: 把"热门赛道"幻觉戳破：供给爆炸vs真正盈利的清醒数据
    candidate_angles: [赛道 ROI 真相, 警惕追逐热点]

