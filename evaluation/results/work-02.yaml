article_brief:
  account: { positioning: 产品经理方法论，从需求分析到落地执行完整流程, audience: PM/产品新人, value_proposition: [完整流程, 踩坑复盘] }
  selected_topic: { topic: AI 时代的 PM：哪些工作会被压缩, angle: 压缩/保留/升值三层清单, confidence: high }
  target_reader: 每天用 AI 提效、又担心被它替代的产品经理
  pain_points: { cognitive: 说不清 AI 到底动了 PM 的哪部分价值, risk: 怕自己成为被压缩的那个人, emotional: 「文档型 PM 还有没有活路」的焦虑 }
  core_insight:
    misconception: 大多数 PM 以为 AI 会"全面替代"，或者反过来否认变化
    evidence: ["GPT-5.5 可胜任文档/代码/研究等复杂任务（人人都是产品经理 2026-04-23）", "94% 企业产品人员每天用 AI 工具（Productboard via FourthRev 2026-05-28）"]
    insight: 被压缩的是"产出型工作"，被放大的是"判断型工作"；判断、对齐、治理是 AI 时代 PM 的护城河
  key_arguments: [文档/整理类价值被压缩是事实, 价值上移：从 feature 协调到系统编排, 判断能力不可外包（定义问题≠回答问题）, 组织治理与数据治理成新职责]
  title_candidates: ["GPT-5.5 之后，产品经理还剩下什么", "文档型 PM 正在贬值：你的护城河是什么", "AI 越强，PM 越要回到定义问题", "94% 的 PM 都在用 AI，差距在哪"]
  outline:
    - { section: Hook, purpose: 抛出替代焦虑, key_points: [GPT-5.5 能写 PRD 的冲击, 文档型 PM 的恐慌] }
    - { section: Problem, purpose: 用数据说明变化是真实的, key_points: [94% 日活/每任务省 4 小时, 产出型工作被压缩] }
    - { section: Misconception, purpose: 破除「全面替代」与「毫无变化」, key_points: [替代只集中在产出型, 否认变化=被拉开差距] }
    - { section: Core Insight, purpose: 给出三层迁移框架, key_points: [压缩：文档/整理, 保留：判断/对齐, 升值：治理/编排] }
    - { section: Mechanism, purpose: 讲清为什么价值上移, key_points: [AI 解决「怎么做」，定义问题是稀缺的, 采纳率 60-80% 需人校验] }
    - { section: Solution, purpose: 能力迁移清单, key_points: [判断能力训练, 人机协作流程设计, 数据治理参与] }
    - { section: Example, purpose: 一个转型案例, key_points: [从功能 PM 到模型驱动产品 PM 的路径, 收入/责任变化] }
    - { section: Action, purpose: 本周可做三件事, key_points: [盘点你 20% 可自动化工作, 立一个人机协作流程, 学一个 AI 产品评估方法] }
  evidence:
    - { source: 人人都是产品经理, source_type: community, date: 2026-04-23, claim: GPT-5.5 面向复杂工作；文档型 PM 价值被压缩, confidence: medium }
    - { source: FourthRev/Productboard, source_type: analytics, date: 2026-05-28, claim: 94% 企业产品人员每天依赖 AI 工具, confidence: medium }