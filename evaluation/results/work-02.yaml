research_findings:
  - topic: 需求分析的方法论体系
    signals: { demand: 「这个需求能不能做、做成什么样」是 PM 最根基问题 }
    evidence:
      - source: 人人都是产品经理（需求分析方法论）
        source_type: community
        date: 2026-01-01
        claim: 需求分析分需求收集（产品/功能/迭代三类）、真实性分析、优先级排序三阶段；竞品分直接/间接/替代三类
        confidence: medium
      - source: 人人都是产品经理（B 端工具箱）
        source_type: community
        date: 2026-01-01
        claim: 需求分析分宏观市场/中观竞品/微观客户需求三层面；配套信息源与报告平台清单
        confidence: medium
    content_gap: 把经典方法论做成"新人可照做的模板"而非理论概述
    candidate_angles: [需求真实性三问, 竞品三分法]

  - topic: AI 正在重构 PM 工作流
    signals: { trend: GPT-5.5 能完成文档型工作，AI 成为 PM 日常工具, demand: 「AI vs PM」焦虑与能力迁移讨论激烈 }
    evidence:
      - source: 人人都是产品经理（GPT-5.5 后 PM 价值）
        source_type: community
        date: 2026-04-23
        claim: OpenAI 2026-04-23 发布 GPT-5.5（面向复杂真实工作）；文档型 PM 价值正被压缩，PM 核心向"判断能力"迁移
        confidence: medium
      - source: FourthRev（GenAI for PM）
        source_type: other
        date: 2026-05-28
        claim: 2025 Productboard 调查 94% 企业产品人员每天依赖 AI 工具；PM 平均每任务省 4 小时（PRD/竞品分析/路线图）
        confidence: medium
    content_gap: 把"AI 焦虑"变成"人机协作分工清单"的中文实操内容
    candidate_angles: [AI 时代的 PM 分工, Prompt 即新 PRD]

  - topic: 竞品分析的正确姿势
    signals: { demand: PM 常把竞品分析做成功能罗列 }
    evidence:
      - source: 墨刀（竞品分析方法论）
        source_type: community
        date: 2026-09-12
        claim: 竞品分析先明确目标与范围（直接/间接），再从官方渠道/第三方平台/数据分析平台多源收集，避免信息过载
        confidence: medium
    content_gap: 竞品分析从"抄功能表"到"判断定位差异"的升级
    candidate_angles: [竞品分析的五个层级, 别把竞品分析做成清单]

  - topic: 从功能驱动到模型驱动
    signals: { trend: AI 产品设计范式转变（PRD→Prompt、确定性→不确定性）, demand: 做 AI 产品的 PM 缺新方法 }
    evidence:
      - source: 人人都是产品经理（思维跃迁）
        source_type: community
        date: 2026-06-01
        claim: Prompt 就是新的 PRD；AI 产品从确定性设计转向拥抱不确定性的模型引导，PM 从功能车间变为模型工坊
        confidence: low
    content_gap: 一线 PM 转型 AI 产品的具体方法论（评价体系/边界设计）
    candidate_angles: [模型驱动产品的验收怎么做, AI 产品的不确定性管理]

