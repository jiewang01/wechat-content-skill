research_findings:
  - topic: 微服务回潮与模块化单体
    signals: { trend: 2026 行业从盲目微服务转向「模块化单体优先」, demand: 中小团队纠结要不要拆/要不要合 }
    evidence:
      - source: CSDN（2026 团队回归实践）
        source_type: social
        date: 2026-09-17
        claim: 中文团队记录 18 个月微服务挣扎后回归模块化单体：23 个服务部署协调地狱、接口耗时 450ms→80ms、一致性代码比业务还复杂
        confidence: high
      - source: bytepane（架构对比研究）
        source_type: other
        date: 2026-05-26
        claim: 2025 Gartner 调查 60% 工程团队后悔对中小应用采用微服务；42% 组织正把服务合并回更大部署单元；微服务基础设施成本约为单体 3.75-6 倍
        confidence: medium
      - source: 亚马逊 Prime Video 案例（多来源引用）
        source_type: analytics
        date: 2023-01-01
        claim: Prime Video 将部分视频监控服务从微服务迁回单体后基础设施成本下降 90%
        confidence: high
    content_gap: 什么规模的团队/系统应该选哪种架构的量化决策框架
    candidate_angles: [决策框架（团队/流量/运维三维）, 微服务回归的复盘]

  - topic: 分布式一致性地狱
    signals: { demand: 分布式事务、幂等、补偿反复踩坑 }
    evidence:
      - source: CSDN 回归实践案例
        source_type: social
        date: 2026-09-17
        claim: 订单-库存-支付一致性场景引入 Saga/事件溯源/补偿后，"保证一致的代码比业务逻辑还复杂"，模块化单体本地事务即可
        confidence: high
    content_gap: 把一致性解决方案按"要不要分布式"分级的选型文章
    candidate_angles: [先别分布式：本地事务优先, Saga 选型清单]

  - topic: 服务治理与可观测性
    signals: { trend: 微服务治理平台（熔断/限流/灰度）产品化, demand: 线上变更风险与故障范围控制 }
    evidence:
      - source: 阿里云 MSE 官方文档
        source_type: official_doc
        date: 2026-05-18
        claim: 微服务治理基于阿里大规模生产实践，提供无损上下线、全链路灰度、限流熔断隔离等能力，无侵入接入
        confidence: medium
    content_gap: 小团队无成熟平台的"轻量治理清单"
    candidate_angles: [治理最小集, 无损上下线实践]

  - topic: Agentic 微服务与 AI 化系统
    signals: { trend: 2026 出现 agentic microservice 相关讨论（认知解耦/非确定性可靠性）, demand: 后端工程师面对 AI 系统不确定性的可靠性方法 }
    evidence:
      - source: Software Curated（架构文章）
        source_type: other
        date: 2026-09-14
        claim: 以思维风格而非数据域拆服务边界；agent 非确定性使 95% 成功率也成为生产事故（可靠性危机）
        confidence: low
    content_gap: 后端视角首次系统性理解 agentic 系统可靠性
    candidate_angles: [agent 系统的可靠性框架, 认知解耦的边界设计]

