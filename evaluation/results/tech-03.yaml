  key_arguments: [康威定律决定架构, 微服务成本 3.75-6x 但收益常被夸大, 模块化单体保留拆分路径, 三个量化条件给决策树]
  title_candidates: ["我们不是 Netflix：中小团队为什么该选模块化单体", "60% 的团队后悔拆了微服务", "3.75 倍成本：微服务账单到底有多贵", "先模块化单体，再谈拆分"]
