  selected_topic: { topic: 中小团队为什么该选模块化单体, angle: 三维量化决策框架, confidence: high }
  target_reader: 团队规模 10-50 人、正为"要不要微服务化"开会的技术负责人
  pain_points: { functional: 团队被微服务运维拖垮、发布协调地狱, efficiency: 拆服 23 个组件的构建/部署/监控成本指数上升, cognitive: 说不清「拆的收益究竟何时兑现」, risk: 拆错后回归成本高 }
  core_insight:
    misconception: 大多数团队以为"微服务=高可用+可扩展"，评审时只看技术不吃成本
