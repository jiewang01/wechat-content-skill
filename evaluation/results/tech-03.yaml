    - { section: Core Insight, purpose: 提出「独立部署边界」标准, key_points: [康威定律：架构镜像组织, 决策变量是团队边界数] }
    - { section: Mechanism, purpose: 讲清成本结构, key_points: [基础设施 3.75-6x, 一致性/可观测性人力成本] }
