  content_style: { tone: 「实战、决策向 〔inferred〕」, format: [长文, 架构复盘, 决策清单] }
  authority:
    strengths: [一线分布式系统实战, 架构演进经验]
    limitations: [非云厂商官方, 非大规模超一线企业视角]
  boundaries: [纯前端话题, 泛互联网新闻, 业务软广]
