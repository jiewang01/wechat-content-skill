# ------------------------------------------------------------
# Stage 5 — Positioning Filter
# ------------------------------------------------------------
top1_selection:
  status: selected
  selected:
    topic: 肌先知 900 店清零：白牌式脆弱的 4 个信号
    angle: 用案例提炼可自查指标，把“别做白牌式生意”变成可执行的自查清单
    market_score: 84
    account_fit: 88
    fit_breakdown: { audience: 88, problem: 88, authority: 84, value: 92, differentiation: 88, style: 86 }
    why_selected:
      market_reason: 2026 最热趋势之一（白牌退场），硬数据多（900 店清零、生命周期 <8 个月、18 万亿规模），话题自带传播性
      audience_reason: 创业者与投流型商家正活在“我会不会成为下一个”的恐惧里，直击主角人群
      account_reason: 账号定位“案例拆解”，此选题是该定位最典型的样本；案例研究方法论可复用
      differentiation_reason: 媒体报道停留在“谁倒了怎么倒”，本稿从案例提炼「自查指标」，把故事变成工具
    risks:
      - 用“破产/限高”等细节讲故事易踩“消费他人苦难”的负面观感
      - 案例披露数据多为媒体报道口径，需标注来源避免夸大
    confidence: high
  rejected:
    - topic: 小红书算法变了：信任分值时代的内容打法
