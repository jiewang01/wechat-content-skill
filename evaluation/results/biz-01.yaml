# ============================================================
# 冒烟测试结果：biz-01（新消费品牌账号）
# 输入：evaluation/evaluation-dataset.yaml -> biz-01.account_brief
# "消费品牌增长案例拆解，从 0 到 1 做新消费"
# 日期：2026-09-18（Stage 2 检索为真实结果，evidence 可溯源）
# 执行器：SKILL.md + prompts/*（按调用顺序）
# ============================================================

# ------------------------------------------------------------
# Stage 1 — Positioning Analysis
# ------------------------------------------------------------
account_profile:
  description: 消费品牌增长案例拆解，从 0 到 1 做新消费
  source: explicit
  audience:
    primary: ["新消费创业者", "品牌/市场运营从业者"]
    secondary: ["电商操盘手", "内容营销从业者 〔inferred〕"]
  domain: ["新消费品牌增长", "品牌案例研究", "渠道与营销打法"]
  value_proposition:
    - 用真实案例拆解品牌从 0 到 1 的增长路径
    - 提供可直接复用的渠道、内容、投放方法论
  content_style:
    tone: "数据向、案例向、不鸡汤 〔inferred〕"
    format: ["案例复盘长文", "数据图表", "方法论清单 〔inferred〕"]
  authority:
    strengths: ["案例研究与增长方法论框架", "跨品类视角"]
    limitations: ["非投资/财务顾问身份；无个股与资本市场观点", "非平台官方信息源"]
  boundaries:
    - 个股推荐 / 上市公司财务分析（身份边界）
    - 泛财经宏观（利率、宏观政策解读）
    - 代运营/投流代投的商业软广
  platform: unknown
  constraints: []

# ------------------------------------------------------------
# Stage 2 — Research（真实检索 2026-09-18）
# ------------------------------------------------------------
research_findings:
  - topic: 流量白牌集体退场与品牌价值回归
    signals:
      trend: 2026 年流量白牌从榜单清零；“不做品牌的商家已经输了”成主流叙事
      demand: 投流型商家想知道自己会不会成为下一个、怎么转向
      discussion: “90% 的卖家做的是白牌式生意”类反思持续升温
    evidence:
      - source: 36kr/天下网商
        source_type: news
        date: 2026-07-17
        claim: 曾碾压大牌的白牌“肌先知”母公司欠债破产，巅峰期 900 多家店铺清零；白牌平均生命周期不足 8 个月
        confidence: high
      - source: 36kr/财经无忌
        source_type: news
        date: 2026-08-14
        claim: 前些年风头正劲的流量白牌在 2026 年 618 集体退场，美妆 TOP20 榜单上白牌席位清零
        confidence: high
      - source: 商业新知（白牌自救手册）
        source_type: community
        date: 2026-05-12
        claim: 2024 年中国白牌商品市场规模超 18 万亿元，白牌面临低价内卷、品牌力弱、合规与流量成本四重挑战
        confidence: medium
    existing_content:
      saturation: medium
      summary: 财经媒体报道密集，但多为“谁倒了、怎么倒”的叙事
    content_gap: 把“白牌生死”翻译成「我自己的生意该怎么自查、怎么转向」的可操作方法缺失
    candidate_angles: [白牌式脆弱体检清单, 从卖货到造牌的换挡路径]

  - topic: 效果广告退潮、品牌预算回归
    signals:
      trend: 效果广告占比多年连续增长在 2025 年逆转，品牌广告占比回升
      demand: 操盘手纠结预算怎么配、ROI 怎么算
    evidence:
      - source: 36kr/财经无忌（引用 QuestMobile 数据）
        source_type: analytics
        date: 2026-08-14
        claim: 2026 年上半年 53.6% 的品牌投放费用加码超 5%，同时 44.9% 收缩超 5%；品牌与效果预算配比 6:4 的长期增长结论被反复引用
        confidence: medium
    existing_content:
      saturation: low
      summary: 观点性文章多，实操换算（我的行业怎么配）缺
    content_gap: 从“行业结论”到“个体决策表”的桥接内容
    candidate_angles: [预算 6:4 的适用边界, 效果广告退潮对我的影响]

  - topic: 小红书 2026 算法重构
    signals:
      trend: 平台进入“理解意图”阶段，语义匹配与信任分值权重急升
      demand: 品牌方投放逻辑过时，获客成本与转化效率承压
    evidence:
      - source: 第三方报告《2026 小红书品牌种草全链路闭环方案》（远瞻慧库转述）
        source_type: analytics
        date: 2026-04-29
        claim: 2026 年算法权重对比：AI 语义匹配 25%→40%，信任分值 15%→25%，关键词匹配 35%→20%，粉丝数量 25%→15%
        confidence: medium
      - source: 新媒小番薯（搜狐号）
        source_type: community
        date: 2026-09-09
        claim: 新品牌冷启动实操：长尾词精准截流 + 20-50 个垂直 KOC 铺信任基础，真实感比精致感重要
        confidence: medium
    existing_content:
      saturation: medium
      summary: 服务商解读多、口径杂，商家难以辨别
    content_gap: 用“信任资产”框架统一解释算法变化与投放打法的内容缺失
    candidate_angles: [信任分值时代的内容打法, 长尾词+KOC 冷启动清单]

  - topic: AI 接管投放，操盘手的转型焦虑
    signals:
      trend: 千川“乘方”发布、TikTok/巨量系全面 AI Agent 化投放，手动调参时代结束
      demand: 投手/品牌运营不知道下一步学什么、怎么不被淘汰
      discussion: “黑盒”“不知道能控制什么”成为群聊高频词
    evidence:
      - source: TopMarketing 三里屯信息流
        source_type: community
        date: 2026-03-13
        claim: 千川·乘方发布后标准计划退场、AI Agent 全面接管投放，投手普遍迷茫；冷启动“小额快跑喂养模型”、爆发期“设 ROI 红线不干预”是新的操作纪律
        confidence: medium
      - source: ZonFlip（TikTok 电商独立观察）
        source_type: community
        date: 2026-08-04
        claim: TikTok Shop 手动购物型广告逐步谢幕，GMV Max 成默认形态；平台官方内部测试称早采用者 GMV 提升 20%，但混同归因导致 ROI 虚高是普遍坑
        confidence: medium
    existing_content:
      saturation: low
      summary: 中文区系统性拆解少，多为零散吐槽
    content_gap: 「把 AI 投放当系统理解而不是黑盒」的框架化内容
    candidate_angles: [AI 投放时代的账户纪律, 投手转型路线图]

  - topic: 消费 K 型分化
    signals:
      trend: 中端价格带塌陷，低价与高端双向扩张
      demand: 中端定位品牌慌，不知往哪端走
    evidence:
      - source: 新浪财经/投资界（引自 FBeauty 未来迹、魔镜洞察）
        source_type: analytics
        date: 2026-08-27
        claim: 2026H1 美妆线上 0-200 元价格带占比升至 59.64%，400 元以上稳定 23.69%，唯独 200-400 元中端从 18.59% 收缩至 16.68%
        confidence: medium
    existing_content:
      saturation: low
      summary: 行业报告多，落到“中端品牌怎么决策”的少
    content_gap: 中端品牌的三条可选路径（做细分功效、极致性价比、垂直赛道）
    candidate_angles: [K 型分化下的三种活法, 中端品牌生存决策树]

  - topic: 白牌品牌化的成功样本（比比赞）
    signals:
      demand: 白牌想品牌化，缺可参照案例
    evidence:
      - source: 经济观察网（学术案例研究）
        source_type: analytics
        date: 2026-04-13
        claim: 比比赞近一年关联达人 2.6 万、直播达人 1.3 万，销售额破亿（直播占 46.83%），实现白牌“认知—行为—情感”三级品牌化跳跃
        confidence: medium
    existing_content:
      saturation: low
      summary: 多数为案例报道，缺少机制化拆解
    content_gap: 把“达人矩阵如何沉淀品牌资产”讲清楚的方法论内容
    candidate_angles: [以比比赞拆达人品牌化三段论]

