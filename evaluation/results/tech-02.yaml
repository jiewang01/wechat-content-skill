  account: { positioning: 前端架构与工程化实践，专注性能优化与团队提效, audience: 前端工程师/团队负责人, value_proposition: [性能方法, 工程化落地] }
  selected_topic: { topic: INP 诊断三部曲：从指标到交互, angle: 三阶段定位法, confidence: high }
  target_reader: 遇到过"Lighthouse 100 分但用户说卡"的前端工程师
  pain_points: { functional: 页面 FPS 正常但交互感觉粘, cognitive: 不知道 INP 高在哪一步, emotional: 「优化无从下手」的无力感 }
  core_insight:
    misconception: 大多数人盯着 FPS 和整体耗时
    evidence: ["INP 是全部交互的 75 分位而非首交互（webperfclinic 2026-05-27）", "真实项目 INP 380ms → 50ms 的治理案例（掘金 2026-05-18）"]
    insight: INP 高≠主线程堵，要用 input delay / processing / presentation 三阶段定位；一个交互一个交互修
  key_arguments: [INP 度量的是体感而非帧率, 三个阶段各有不同解法, Performance event API 可精准圈定慢交互, 每个修复都要带回测与监测]
  title_candidates: ["Lighthouse 满分，为什么用户还是说卡", "INP 诊断三部曲：找到真正慢的那一步", "你的页面很流畅，但 INP 380ms", "把交互延迟压到 50ms 的三个 API"]
  outline:
    - { section: Hook, purpose: 复现「100 分但卡」矛盾, key_points: [FPS 60 但点击粘手, 用户狂点按钮] }
    - { section: Problem, purpose: 说明 INP 是什么与为什么难, key_points: [取代 FID 的响应指标, 四分之一站点不达标] }
    - { section: Misconception, purpose: 破除盯 FPS/整体耗时, key_points: [帧率≠交互体感, 只看整体耗时找不到元凶] }
    - { section: Core Insight, purpose: 提出三阶段框架, key_points: [input delay/processing/presentation, 与各自成因对应] }
    - { section: Mechanism, purpose: 讲三阶段微观机制, key_points: [主线程抢占导致 input delay, 渲染与布局导致 presentation] }
    - { section: Solution, purpose: 给诊断路径与工具, key_points: [Performance event API 圈慢交互, LoAF 定位长任务] }
    - { section: Example, purpose: 真实治理案例, key_points: [380ms→50ms 三步, 每个修法的前后数据] }
    - { section: Action, purpose: 今天就能开始, key_points: [给三个高频交互打点, 截取最差一条开始诊断] }
  evidence:
