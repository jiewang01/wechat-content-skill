# 冒烟测试结果：tech-02（前端架构/性能优化账号）
# 输入："前端架构与工程化实践，专注大前端性能优化与团队提效"
# 日期：2026-09-18 ｜ Stage 2 为真实检索，evidence 可溯源
# 记录形态：紧凑评估记录（profile / findings / candidates20 / top5 / top1 / brief）

account_profile:
  description: 前端架构与工程化实践，专注大前端性能优化与团队提效
  source: explicit
  audience: { primary: [前端工程师, 前端团队负责人], secondary: [全栈工程师] }
  domain: [前端架构, 工程化, 性能优化, 团队提效]
  value_proposition: [可复用的性能优化方法, 工程化落地与团队规范]
  content_style: { tone: 「工程向、数据向 〔inferred〕」, format: [长文, 复盘, 配置清单] }
  authority:
    strengths: [一线前端架构与性能治理经验, 团队工程化实践]
    limitations: [非框架官方维护者, 非专项性能测试机构]
  boundaries: [后端深度话题, 泛互联网新闻, 工具评测软广]
  platform: unknown
  constraints: []

research_findings:
  - topic: INP 取代 FID 成为最难 Web 指标
    signals: { trend: INP 成为 Core Web Vital 与谷歌排名信号，四分之一站点仍未达「好」标准, demand: 页面流畅但指标不合格的困惑案例增多 }
    evidence:
      - source: webperfclinic（INP 指南）
        source_type: official_doc
        date: 2026-05-27
        claim: INP 阈值：<200ms 好 / 200-500ms 待改进 / >500ms 差（75 分位）；约四分之一的站点仍不达标
        confidence: high
      - source: 掘金（真实项目实战）
        source_type: social
        date: 2026-05-18
        claim: 中文开发者记录真实项目 INP 380ms 治理，用 scheduler.yield / useTransition / content-visibility 将交互延迟压到 50ms 内
        confidence: medium
    content_gap: 从"指标不达标"到"定位哪个交互、哪个阶段慢"的完整诊断路径内容稀缺
    candidate_angles: [INP 诊断三部曲, 交互级性能预算]

  - topic: JS bundle 预算
    signals: { trend: 2026 推荐首屏 JS 预算收紧至 ~170KB 压缩, demand: 大包拖慢首屏与 INP 无法根治 }
    evidence:
      - source: TheSimplifiedTech（bundling 指南）
        source_type: other
        date: 2026-06-01
        claim: 内容/落地页推荐首屏 JS ≤~170KB（压缩）；可在 CI 中设预算门槛防回归
        confidence: medium
      - source: webperfclinic（2026 bundle 优化）
        source_type: other
        date: 2026-07-13
        claim: 把 JS 预算拆成 critical(<80KB)/deferred(<60KB)/on-demand(<30KB) 三档跟踪
        confidence: medium
    content_gap: 团队如何把"体积预算"变成 CI 门槛与评审规则的落地方案
    candidate_angles: [JS 预算三档法, CI 体积门禁]

  - topic: 构建工具 Rust 化
    signals: { trend: Rspack/Turbopack/Farm 等 Rust 系构建器提速 5-20x, demand: Webpack 大项目构建慢 }
    evidence:
      - source: Rspack 官方博客
        source_type: official_doc
        date: 2026-08-26
        claim: Rspack 2.2 发布，30+ 性能优化，部分场景构建提速 ~5%，HMR 大 stylesheet 场景热更新从 385ms 降至 ~6ms
        confidence: high
    content_gap: 迁移决策：什么时候值得从 Webpack 迁到 Rust 系工具
    candidate_angles: [迁移决策树, 渐进迁移方案]

  - topic: 性能度量文化
    signals: { demand: 团队想要「指标驱动」但没人推进 }
    evidence:
      - source: Nodesify（Core Web Vitals 指南）
        source_type: other
        date: 2026-07-09
        claim: 强调真实用户数据（field）与诊断数据（lab）分离使用；流量不足时如实记录限制而非用单次 lab 当证据
        confidence: medium
    content_gap: 小团队无埋点也能做性能度量与验收的方式
    candidate_angles: [轻量级 RUM 方案, 性能验收清单]

