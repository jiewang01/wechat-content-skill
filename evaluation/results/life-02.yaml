  value_proposition: [可坚持的方案, 个人实测]
  content_style: { tone: 「科学、反焦虑 〔inferred〕」, format: [图文, 食谱方案, 实测记录] }
  authority:
    strengths: [健康饮食实践与方案设计, 营养学知识科普]
    limitations: [非医师/营养师执业身份（不能给医疗处方）]
  boundaries: [疾病治疗与药物建议, 极端节食/伤身方法, 医疗功效宣传]
  platform: unknown
  constraints: []

research_findings:
  - topic: 16+8 的争议：U 型曲线与"跌落神坛"
    signals: { trend: 2025-2026 多项研究对 16+8 的长期收益提出质疑, discussion: 「16+8 跌落神坛」话题引发关注 }
    evidence:
      - source: Aging Cell 研究（维克森林/匹兹堡大学，NHANES 33052 人）
        source_type: analytics
        date: 2025-09-01
        claim: 进食窗口与全因死亡呈 U 型：进食 ≤8 小时组全因死亡风险高 34%、心血管死亡风险高 50%+；11-12 小时窗口风险最低；系观察性研究
        confidence: medium
      - source: Clinical Nutrition 研究（土耳其 6 周试验）
        source_type: analytics
        date: 2025-04-01
        claim: 31 名年轻男性 16+8 减重 2.8kg 中约 1.4kg 来自瘦体重（约半数为肌肉等），心血管代谢指标无显著改善
        confidence: medium
      - source: 新华网（德国 ChronoFast 试验，Science Translational Medicine）
        source_type: news
        date: 2026-01-06
        claim: 31 名超重女性恒定热量下 16+8 对血糖血脂等心血管代谢指标无改善，益处可能来自无意减热量而非时间窗本身
        confidence: high
      - source: 澎湃（Nutrients 荟萃分析，宁夏医科大学）
        source_type: news
        date: 2026-06-09
        claim: 28 项 RCT 荟萃：轻断食收益随年龄分化——30-44 岁几乎无代谢改善，30 岁以下 LDL-C 显著升高，45+ 有心血管收益但有肌肉流失风险
        confidence: medium
    existing_content:
      saturation: high
      summary: 喝彩与唱衰并存，信息矛盾让普通人无所适从
    content_gap: 基于证据一致性的"普通人该用什么方法"的决策内容
    candidate_angles: [16+8 的真相梳理, 减脂的真正机制=热量缺口]

  - topic: 减脂的正确机制：热量缺口与可持续
    signals: { trend: 官方指南强调「慢就是快」与生活方式改造, demand: 「反智速瘦」话术盛行 }
    evidence:
      - source: 国家卫健委《成人肥胖食养指南（2024 年版）》（北京市疾控转载 2026-04-24）
        source_type: official_doc
        date: 2026-04-24
        claim: 科学减重=能量负平衡；推荐每周减 0.5-1kg，6 个月减体重的 5%-10%；饮食"红黑榜"+ 细嚼慢咽 + 睡眠与久坐管理
        confidence: high
      - source: 人民网（冯雪/阜外医院）
        source_type: news
        date: 2026-01-01
        claim: 减重三大误区（快速减重≠有效减脂、突击高强度、只动不吃）；九成职场人制定过减重计划但坚持下来的不足两成；"慢就是快"
        confidence: high
    content_gap: 把官方指南翻译成"上班族可执行的日常方案"
    candidate_angles: [官方指南落地版, 每周 0.5kg 现实目标法]

  - topic: 上班族减脂的现实方案
    signals: { demand: 打工人「外卖+久坐+熬夜」三难 }
    evidence:
      - source: 央广网（上海疾控朱珍妮）
        source_type: news
        date: 2026-05-14
        claim: 致胖四陷阱=久坐/外卖/熬夜/压力；外卖"少油少盐"、碎片运动、零食健康替换、纠正"不吃早餐能减重"误区
        confidence: high
      - source: 福州市疾控（职业人群减肥攻略）
        source_type: official_doc
        date: 2026-04-03
        claim: 工位微运动 + 外卖选择原则（一拳头主食+两拳头蔬菜+一掌心蛋白）+ 每周减 0.5kg 目标
        confidence: medium
    content_gap: 专门针对"没时间/没条件"的综合方案（而非单点建议）
    candidate_angles: [外卖点单法, 碎片时间运动]

