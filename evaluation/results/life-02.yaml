# 日期：2026-09-18 ｜ Stage 2 为真实检索，evidence 可溯源
# 记录形态：紧凑评估记录

account_profile:
  description: 轻断食与健康饮食实践，普通人也能坚持的减脂方案
  source: explicit
  audience: { primary: [想减脂的普通人, 上班族], secondary: [健身爱好者] }
