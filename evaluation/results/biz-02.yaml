article_brief:
  account: { positioning: 跨境电商独立站运营日记，数据驱动选品与投放, audience: 跨境卖家/独立站卖家, value_proposition: [数据化运营, 真实复盘] }
  selected_topic: { topic: 流量溢出：独立站怎么接住 TikTok 的 70%, angle: 溢出承接与数据沉淀, confidence: high }
  target_reader: 已在内容平台有流量、想把用户沉淀到自有站的独立站卖家
  pain_points: { functional: 站外流量看完就走不成交, efficiency: 多平台重复建店却互不相通, risk: 单平台依赖被限流就完蛋, cognitive: 说不清溢出流量价值在哪 }
  core_insight:
    misconception: 大多数独立站卖家以为 TikTok 只能种草、转化做不起来
    evidence: ["约 70% 流量溢出至站外（雨果网 ACE）", "实例：TikTok 月销 200 万刀带动亚马逊月销 80-100 万刀", "开环电商 GMV 超千亿美元、独立站 +13%（TikTok 峰会）"]
    insight: 溢出的本质是"内容平台的公域信任"被转成"独立站的私域资产"；承接的关键是数据回传、落地页与复购设计，而非简单导流
  key_arguments: [溢出=公域信任转私域资产, 数据回传让模型越跑越准, 落地页与支付是承接漏斗, 三位一体降低单一依赖风险]
  title_candidates: ["TikTok 流量的 70% 都溢出了，你接住了吗", "单店月销 200 万刀，怎么再带动 100 万", "独立站的流量焦虑：从种草到沉淀", "别把 TikTok 只当种草工具"]
  outline:
    - { section: Hook, purpose: 用溢出数据带入, key_points: [70% 流量溢出场景, 看完不买的痛] }
    - { section: Problem, purpose: 说明单平台依赖风险, key_points: [平台规则一变生意归零, 数据全在别人手里] }
    - { section: Misconception, purpose: 破除「TikTok 只种草」直觉, key_points: [溢出也是资产, 公域信任可转私域] }
    - { section: Core Insight, purpose: 提出承接框架, key_points: [回传-转化-沉淀三段, 数据决定复发效率] }
    - { section: Mechanism, purpose: 讲溢出机制, key_points: [兴趣推荐侧服务选择, 开环广告与 TIP 链路] }
    - { section: Solution, purpose: 承接三件套, key_points: [像素/eAPI 回传, 中间页与站内转化优化, 复购与会员机制] }
    - { section: Example, purpose: 200→100 案例复盘, key_points: [数据链路配置, 各环节表现] }
    - { section: Action, purpose: 本周启动, key_points: [接通转化回传, 建 TIP 测试计划, 定义 LTV 指标] }
