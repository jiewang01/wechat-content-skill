research_findings:
  - topic: TikTok 开环与全域联动成为主流打法
    signals: { trend: 2026 平台力推开环电商与「内容+货架+独立站」联动, demand: 独立站缺流量入口 }
    evidence:
      - source: TikTok for Business 2026 开环电商峰会报道
        source_type: analytics
        date: 2026-09-11
        claim: 2026 全球出海开环电商 GMV 超千亿美元（年增 10%），独立站数量 +13%，广告支出 +16%；开环生意靠爆品，区域选品差异显著（美：女装/珠宝，中东：美妆）
        confidence: high
      - source: 雨果网（ACE 全域经营）
        source_type: community
        date: 2026-07-01
        claim: 约 70% 流量溢出至站外；实例：TikTok 单店月销 200 万美金可带动亚马逊月销 80-100 万；2026 主流策略=TikTok+亚马逊+独立站三位一体
        confidence: medium
    content_gap: 流量溢出的承接：独立站如何接住站外流量并沉淀数据 的方法论
    candidate_angles: [三位一体打法, 溢出流量承接]

  - topic: 收款合规是生死线
    signals: { demand: 「有订单进不来钱」比没订单更难受, trend: 独立站无平台担保，风控更严 }
    evidence:
      - source: 2cshop（独立站收款防冻指南）
        source_type: community
        date: 2026-07-24
        claim: 独立站收款核心原则"合规＞方便"；PayPal 关联风险高、申诉 30-90 天；Stripe 需境外主体；本地化支付可提升转化 15%-25%
        confidence: medium
      - source: 谷桥科技（2026 独立站合规要点）
        source_type: community
        date: 2026-05-20
        claim: 62% 跨境卖家因合规问题遭遇账号受限/货款冻结，平均单次损失超 2 万元；欧盟 Cookie/CE、泰国取消免税起征、沙特地址短码等地区差异
        confidence: medium
    content_gap: 把"合规红线"按市场拆解成开店前自查清单
    candidate_angles: [收款方式选型, 合规自查清单]

  - topic: 新手建站避坑
    signals: { demand: 新手第一站常被套路 }
    evidence:
      - source: 建站100（独立站避坑指南）
        source_type: community
        date: 2026-05-17
        claim: 低价全包建站是割韭菜套路；域名/服务器务必自持（案例：被锁域名要"赎金"）；先选品定位于定位再建站
        confidence: medium
    content_gap: 把关"钱与数据命脉"的建站决策清单
    candidate_angles: [建站避坑清单, 域名自持红线]

  - topic: 跨境大盘：竞争与合规双升级
    signals: { trend: 跨境占线上零售 22%（2023 的 15%→2026 22%）, discussion: 红利仍在但门槛升 }
    evidence:
      - source: eMarketer（via Ecommerce Times）
        source_type: analytics
        date: 2026-07-20
        claim: 跨境电商业 2026 占全球线上零售 22%；68% 发达市场消费者近 12 个月有过跨境购买（2024：54%）；EU ViDA 增值税新规 2026-01 生效
        confidence: medium
    content_gap: 门槛升级后的"红利在哪、坑在哪"的导航内容
    candidate_angles: [2026 入局评估, 合规税改地图]

