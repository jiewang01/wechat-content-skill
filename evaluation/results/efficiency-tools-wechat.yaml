# ============================================================
# 真实运行：效率工具分享公众号（efficiency-tools-wechat）
# 输入（用户提供账号简介）：
#   ✨ 好用的东西，值得分享
#   AI工具｜办公软件｜手机电脑｜数码产品
#   课程｜招聘｜企业服务｜实用互联网服务
#   发现好东西，分享真实体验
#   ⚡ 提升效率，少走弯路；⏳ 省下时间，留给真正重要的事
#   🌱 多一点选择，慢慢走向更自由的生活
# 日期：2026-09-18 ｜ Stage 2 为真实检索，evidence 可溯源
# 执行器：SKILL.md + prompts/*（按调用顺序）
# ============================================================

# ------------------------------------------------------------
# Stage 1 — Positioning Analysis（prompts/profile-parser.md）
# ------------------------------------------------------------
account_profile:
  description: 好用的东西，值得分享——AI 工具、办公软件、数码产品、课程招聘企业服务等实用互联网服务的最优体验分享
  source: explicit
  audience:
    primary: ["想提升效率的职场打工人", "数码与互联网服务尝鲜的用户"]
    secondary: ["学生、中小创业者 [inferred]"]
  domain: ["AI 工具", "办公软件", "效率工具", "数码产品", "实用互联网服务"]
  value_proposition:
    - 发现并实测"真好用"的工具与服务，帮读者少走弯路
    - 把省下的时间留给更重要的事，让生活多一点选择
  content_style:
    tone: "真诚、实用、不吹不黑 [inferred]"
    format: ["工具实测推文", "清单盘点", "避坑提醒"]
  authority:
    strengths: ["工具实测体验与横向对比", "跨领域工具选型经验"]
    limitations: ["非厂商/机构官方视角", "预算与场景以个人和小团队为主"]
  boundaries:
    - 与"真实体验"冲突的纯软广/付费置换内容
    - 泛 AI 技术科普与新闻评论（超出选型应用层）
    - 时政与无依据的产品功效宣传
  platform: wechat
  constraints: [公众号单篇长度与推文频次约束〔inferred〕]

# ------------------------------------------------------------
# Stage 2 — Research（prompts/research.md，真实检索 2026-09-18）
# ------------------------------------------------------------
research_findings:
  - topic: AI 工具盘的"收藏吃灰"困境
    signals:
      trend: AI 工具每周上新，"必须收藏"盘点文泛滥
      demand: 用户收藏即吃灰、装了就删，缺"真正值得用"的判断
      discussion: 「收藏，然后，再也没有打开过」成高频自嘲
    evidence:
      - source: 爱范儿（经新浪科技转载）
        source_type: news
        date: 2026-06-04
        claim: AI 工具推荐已成"显学"，标题夸张、列表越来越长；真正留在工位天天用的只有几个；「能做什么」和「我会用它做什么」之间隔着一条河
        confidence: high
      - source: Izoate（Reddit 整理）
        source_type: community
        date: 2026-08-23
        claim: Reddit 共识：好工具是"ambient"式融入现有习惯的工具；终极检验是三个月后是否还在用
        confidence: medium
      - source: TipsMafia
        source_type: community
        date: 2026-01-01
        claim: 2026 更值得先试的工具是"只解决一个痛点"的窄工具（如 Wispr Flow 语音写作、Granola 会议纪要），而不是"接管全天"的大而全
        confidence: medium
    existing_content:
      saturation: very_high
      summary: 盘点/榜单内容极度饱和（中英文皆然）
    content_gap: 从"推工具"转向"教大家怎么选、怎么防吃灰"的方法论稀缺
    candidate_angles: [精用少工具, 两周测试法]

  - topic: AI 推荐被"投喂"：GEO 软广乱象
    signals:
      trend: GEO（生成式引擎优化）商家批量发软文"喂养"AI 推荐结果
      demand: 用户问 AI 买到坑产品，信任受损
      discussion: 「AI 推荐藏广告」「种草式推荐」被集中吐槽
    evidence:
      - source: 工人日报（中国经济网转载）
        source_type: news
        date: 2026-01-19
        claim: 用户质疑 AI 工具推荐被广告"精准投喂"；商家通过提示词诱导与批量发布结构化软文，把推广伪装成"客观推荐"；GEO 服务按曝光收费 5000-10000 元
        confidence: high
      - source: 京报网（中央广播电视总台中国之声）
        source_type: news
        date: 2026-01-25
        claim: 消费者"问问 AI"遭遇隐性营销：AI 直接给出带预订链接的"推荐"；商家用角色扮演式提示词+榜单软文影响 AI 回答
        confidence: high
      - source: 新华网（AI 虚假广告）
        source_type: news
        date: 2026-06-09
        claim: AI 生成广告夸大产品功能构成虚假宣传；「标注'AI 生成'不是免责牌」，误导消费者仍需担责
        confidence: high
    existing_content:
      saturation: low
      summary: 政策/维权报道多，把"如何识破、如何选"讲给普通用户的实用内容少
    content_gap: 面向普通用户的"AI 推荐可信度"识破与自我保护指南
    candidate_angles: [GEO 软广识别, AI 推荐防坑]

  - topic: 订阅疲劳与免费平替
    signals:
      trend: 主流 AI 订阅 $20-100/月，功能重叠严重
      demand: 用户想精简订阅、找免费平替
    evidence:
      - source: Izoate（Reddit 2026）
        source_type: community
        date: 2026-08-23
        claim: 订阅疲劳是 2026 最大摩擦点；用户受够为重叠功能每月付 $20-100；不必为 50 个订阅才高效
        confidence: medium
      - source: CSDN 中文盘点
        source_type: social
        date: 2026-09-17
        claim: 中文区出现"不折腾、真提效"的平替叙事（如 Windsurf 免费额度更多作 Cursor 平替、Trae 国内直连免翻墙）
        confidence: medium
    existing_content:
      saturation: medium
      summary: 平替清单已有，但多停留在单品罗列
    content_gap: 按【免费额度-场景-迁移成本】做订阅精简决策的方法
    candidate_angles: [订阅精简账, 免费平替清单]

  - topic: AI 办公进入"嵌入式 + Agent"时代
    signals:
      trend: AI 内嵌进 Office/Workspace，Agent 承担多步任务
      demand: 打工人想知道"现在还值不值得单独买工具"
    evidence:
      - source: Microsoft 365 官方博客
        source_type: official_doc
        date: 2026-03-09
        claim: Copilot Wave 3 将 Agentic 能力直接嵌入 Word/Excel/PPT/Outlook；Copilot Cowork 可跨文件多步执行
        confidence: high
      - source: AI Tools DevPro（Workforce Labs）
        source_type: analytics
        date: 2026-01-01
        claim: 每日使用 AI 的职场人生产力 +64%、专注 +58%；平均每位知识工作者为完成单件工作使用 5+ 个 AI 工具
        confidence: medium
    existing_content:
      saturation: medium
      summary: 厂商宣传多，普通用户"我该升级什么"的决策内容少
    content_gap: 把"内嵌 vs 独立工具"的选择讲给普通办公用户的视角
    candidate_angles: [先吃内嵌功能, 工作流拼装]

