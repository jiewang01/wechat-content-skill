article_brief:
  account: { positioning: 职场沟通与向上管理的实战经验，帮打工人少走弯路, audience: 1-5 年职场人, value_proposition: [可复用沟通方法, 避坑经验] }
  selected_topic: { topic: PREP 万能汇报模板：今天就能用, angle: 三场景逐字稿, confidence: high }
  target_reader: 下周就要汇报/述职、担心又被说"没重点"的职场人
  pain_points: { efficiency: 加班做了很多但汇报体现不出来, cognitive: 不知道领导想听什么, emotional: 「努力被低估」的委屈 }
  core_insight:
    misconception: 大多数人以为汇报是把工作过程讲完整
    evidence: ["PREP/金字塔在职场被普遍验证有效（36kr 2026-04-14）", "80% 的信任来自同步（36kr）"]
    insight: 汇报的本质是"给领导确定性"，结构（观点先行）比内容量更重要；PREP 是可照抄的最小结构
  key_arguments: [结论先行是尊重领导时间, PREP 四步覆盖口头/书面/晋升, 逐字稿降低上手门槛, 周报/1on1 可复用同一结构]
  title_candidates: ["领导说我没重点：PREP 三句话救回来", "周报只会记流水账？试试 PREP", "汇报不是交差，是向上管理", "给你 3 分钟，怎么说领导才点头"]
  outline:
    - { section: Hook, purpose: 复现「被批没重点」场景, key_points: [讲半小时领导问「你到底想说什么」, 干得好不如汇报好的案例] }
    - { section: Problem, purpose: 说明汇报是向上管理核心, key_points: [80% 信任来自同步, 汇报决定价值被看见的程度] }
    - { section: Misconception, purpose: 破除「讲完整过程」误区, key_points: [领导要的是确定性不是过程, 内容量不等于说服力] }
    - { section: Core Insight, purpose: 提出「给确定性」本质, key_points: [结论先行=高级的职业尊重, PREP 是最小结构] }
    - { section: Mechanism, purpose: 讲金字塔原理为什么有效, key_points: [认知负担/时间稀缺, 结果思维] }
    - { section: Solution, purpose: PREP 四步+三种场景逐字稿, key_points: [口头汇报/周报/晋升各给一版, 常见错误对照] }
    - { section: Example, purpose: 改写前后对比, key_points: [同一件事流水账版 vs PREP 版, 领导反应差异] }
    - { section: Action, purpose: 今天能做的三件事, key_points: [把下周汇报改写成 PREP, 收集一个数据例证, 30 秒结论先行练习] }
  evidence:
    - { source: 36氪, source_type: social, date: 2026-04-14, claim: PREP/金字塔模型在各类汇报中普遍有效, confidence: high }
    - { source: Confidence Playbook, source_type: other, date: 2026-03-21, claim: 汇报先给推荐结论、围绕业务影响、预判问题, confidence: medium }