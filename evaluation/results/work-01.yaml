# 冒烟测试结果：work-01（职场沟通/向上管理账号）
# 输入："职场沟通与向上管理的实战经验，帮打工人少走弯路"
# 日期：2026-09-18 ｜ Stage 2 为真实检索，evidence 可溯源
# 记录形态：紧凑评估记录

account_profile:
  description: 职场沟通与向上管理的实战经验，帮打工人少走弯路
  source: explicit
  audience: { primary: [职场 1-5 年员工, 基层管理者], secondary: [应届生] }
  domain: [职场沟通, 向上管理, 职业发展]
  value_proposition: [可复用的沟通方法, 向上管理避坑经验]
  content_style: { tone: 「实战、务实 〔inferred〕」, format: [图文, 场景对话拆解, 清单] }
  authority:
    strengths: [一线职场经验, 沟通方法论]
    limitations: [非 HR/管理咨询机构官方]
  boundaries: [技术教程, 八卦娱乐, 时政评论]
  platform: unknown
  constraints: []

research_findings:
  - topic: 汇报是向上管理的核心杠杆
    signals: { trend: PREP/金字塔等结构化表达被反复验证, demand: 「干得好不如汇报得好」成高频痛点 }
    evidence:
      - source: 36氪（职场汇报万能模板）
        source_type: social
        date: 2026-04-14
        claim: PREP 模型（观点-依据-案例-重申）可套用口头汇报/周报/晋升汇报；金字塔原理结论先行；"职场 80% 的信任来自同步"
        confidence: high
      - source: Confidence Playbook（向上沟通规则）
        source_type: other
        date: 2026-03-21
        claim: 汇报先给推荐结论、围绕业务影响展开、预判问题提前回答（What-So What-Now What 框架）
        confidence: medium
    content_gap: 把模型讲成"领导视角"，并从场景出发给逐字稿的内容稀缺
    candidate_angles: [PREP 逐字稿, 汇报的五个漏斗]

  - topic: 向上管理不越界的边界感
    signals: { demand: 很多人把向上管理误读为「做领导喜欢的」，又怕越界 }
    evidence:
      - source: Niagara Institute（Managing Up 指南）
        source_type: other
        date: 2026-06-28
        claim: 向上管理=替自己这侧的关系负责；明确期望（"好的交付长什么样"）可化解大部分分歧；不要替领导做决定/公开纠正
        confidence: medium
      - source: Yogen（Managing Up 手册）
        source_type: other
        date: 2026-01-01
        claim: 先给证据再给结论、提供三个可选方案+推荐、用中性解决问题的语言避免防御感
        confidence: medium
    content_gap: "‘不 PUA 自己也不讨好领导’的中道操作指南"
    candidate_angles: [管理领导期望, 提出选项而非问题]

  - topic: 职场边界与"静默离职"文化
    signals: { trend: 拒绝加班/工作边界成为社交媒体高热度议题, discussion: 微博「职场生存法则」话题阅读 7.2 亿 }
    evidence:
      - source: 复旦《管理视野》（36kr 转载）
        source_type: analytics
        date: 2026-07-16
        claim: 静默离职（只做职责内最低限度工作）成群体共识；微博"职场生存法则"话题阅读量突破 7.2 亿；Gallup 59% 劳动者不敬业
        confidence: medium
      - source: 职场内耗实操文（get to know）
        source_type: social
        date: 2026-05-02
        claim: 内耗化解=边界感+钝感力+优先级；学会温和坚定拒绝"不属于自己的任务"
        confidence: low
    content_gap: 把"表态"升级为"方法"：怎么温和拒绝、怎么守住边界且不被穿小鞋
    candidate_angles: [温和拒绝的话术, 边界感的落地动作]

  - topic: 新生代 vs 传统领导的代际沟通
    signals: { demand: 年轻员工与上司预期不一致，冲突变公开话题 }
    evidence:
      - source: LinkedIn 病毒话题（Entertales 转述）
        source_type: social
        date: 2026-06-14
        claim: Gen Z 员工拒绝 9PM 会议（"那就安排在上班时间"，"大家都 burnout 了，我不想burnout"）引发全球关于工作边界的辩论
        confidence: medium
    content_gap: 不打"代际战争"标签、双向理解与协商话术的内容
    candidate_angles: [拒绝加班的协商话术, 领导视角的期待管理]

