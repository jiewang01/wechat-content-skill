  account: { positioning: 高考数学冲刺提分，方法比刷题更重要, audience: 高中生/家长, value_proposition: [提分方法, 解题策略] }
  selected_topic: { topic: 反刷题时代：刷题为什么没用了, angle: 官方转型解读 + 新备考动作, confidence: high }
  target_reader: 刷了大量题但模考分数停滞的准高三/高三学生
  pain_points: { efficiency: 题海战术投入巨大收益递减, cognitive: 题型一变就不会做, risk: 方向错误浪费关键时间, emotional: 「我刷题都这么努力了」的委屈 }
  core_insight:
    misconception: 大多数学生认为"题做得越多分越高"，把刷题等同于学习
    evidence: ["2026 命题从考熟练度转向考思维、弱化二级结论（教育部教育考试院评析）", "反刷题改革从 2020 年教育评价改革起推进，题序调整与情境题让肌肉记忆式答题失效（陈志文）"]
    insight: 高分拼的是"用原理破解新情境"的能力；刷题只该用于熟练，思维训练（真题追问/一题多变/回归教材）才是提分杠杆
  key_arguments: [命题转型是官方明确方向, 刷题≠思维训练, 回归教材+一题三问的有效替代, 错题诊断让刷题有目的]
