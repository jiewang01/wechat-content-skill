        source_type: news
        date: 2026-06-08
        claim: 2026 高考数学打破"背题型"模式，创新情境+开放设问，考查重心转向思维品质与核心素养；贯彻"多想少算"
        confidence: high
      - source: 掌上高考（教育在线总编辑陈志文）
        source_type: news
        date: 2026-06-09
        claim: #数学难 话题阅读超 10 亿；改革本质是"反刷题"，从 2020 年教育评价改革起持续推进；题目顺序调整+情境题致肌肉记忆式考生不适
        confidence: high
      - source: 教育在线（2026 高考数学试题评析）
        source_type: news
        date: 2026-06-11
        claim: 官方评析：从解题熟练度转向思维能力，从固化题型转向灵活情境；"原因是长期依赖刷题套路难适应创新题型"
        confidence: high
    content_gap: 把"反刷题"翻译成具体的备考动作（如何练思维、怎么用真题）
    candidate_angles: [反刷题时代的学习法, 真题的思维训练用法]

  - topic: 错题管理的科学做法
    signals: { demand: 错题本人人有，会用的人少 }
    evidence:
      - source: 北京市第三十五中学付海龙（分阶段复习）
        source_type: official_doc
        date: 2025-01-01
        claim: 按"模块+错误类型"（概念不清/方法错误/计算失误/审题失误）整理错题；每周复盘 1 次，月做一次"错题重组测试"
        confidence: medium
      - source: 东北师大附中庄乾岭（冲刺提分）
        source_type: news
        date: 2026-06-03
        claim: 错题表格四要素（题型/知识点/失分原因）；单选错=基础弱需推公式，多选错=概念辨析，计算错=限时定点训练
        confidence: high
    content_gap: 把错题本从"抄题本"升级为"诊断表"的操作标准
    candidate_angles: [错题四分类诊断法, 错题重组测试]

  - topic: 考场节奏与状态管理
    signals: { demand: 会做但考不好（时间/心态） }
    evidence:
      - source: 新黄河（安庆一中吴礼琴）
        source_type: news
        date: 2026-04-27
        claim: 选填 45-50 分钟、压轴超过 3 分钟无思路果断跳过；前三道大题 30-35 分钟"一遍过"；草稿纸分区、步骤分策略
        confidence: medium
      - source: 华商报（名师压箱底建议）
        source_type: news
        date: 2026-05-21
        claim: 我易人易不大意、我难人难不慌张；会做的题全做对=颗粒归仓
        confidence: medium
    content_gap: 把"节奏"做成可训练的目标时间表
    candidate_angles: [选填 45 分钟节奏表, 步骤分最大化]

