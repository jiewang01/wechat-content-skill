research_findings:
  - topic: 亲子共读的科学与方法
    signals: { demand: 家长普遍买书多、会读的少; 存在「为什么孩子不爱听」困惑 }
    evidence:
      - source: 京学附属实验幼儿园（育儿科普）
        source_type: other
        date: 2025-10-09
        claim: 0 岁起可开始阅读；固定的绘本选择原则（按 2-3/3-4/4-5/5-6 岁分龄）；固定阅读时间+阅读角+身教
        confidence: medium
      - source: 新浪育儿（绘本正确阅读）
        source_type: other
        date: 2014-07-16
        claim: 耳朵×眼睛双通道是儿童进入书的方式；关键误区是"指着文字读"而非引导读图；呼吁抛弃功利目的
        confidence: medium
      - source: 台湾幼教资料（亲子共读妙点子）
        source_type: official_doc
        date: 2016-01-01
        claim: 分龄共读：2-3 岁化整为零分段读，4-6 岁把共读变成家庭仪式；共读精髓是共享生命经验的温暖联结
        confidence: low
    content_gap: 把"分龄共读+读图+仪式感"整合成一套家庭可执行的方案
    candidate_angles: [分龄共读法, 读图而非指字, 共读仪式化]

  - topic: 二孩家庭的公平与争宠
    signals: { trend: 二胎家庭普遍纠结「一碗水端平」, discussion: 「你们太偏心了」是高频场面 }
    evidence:
      - source: 《民生周刊》（多子女教育）
        source_type: analytics
        date: 2022-01-24
        claim: 心理学副研究员周洁提出"公平≠平等"：公平是按个体需求定制化满足（给小个子孩子两个垫子），而非给每人一个垫子
        confidence: medium
      - source: 人民网（二孩平衡）
        source_type: news
        date: 2015-11-06
        claim: 大宝"争宠"本质是被忽视的恐惧；建议让大宝参与照顾二宝获得身份认同，父母分别陪伴
        confidence: medium
      - source: 山西晚报（二胎必修课）
        source_type: news
        date: 2025-04-17
        claim: 实录：用"母爱充电"（每天单独陪伴 30 分钟）+ 谈话开导化解大宝不安全感；避免"比赛式"比较
        confidence: medium
    content_gap: 把"公平≠平等"提炼成可实践的家规（陪伴安排/夸法/冲突仲裁）
    candidate_angles: [公平≠平等怎么落地, 大宝单独陪伴机制]

  - topic: 习惯养成的正确打开方式
    signals: { demand: 家长在「立规矩」与「尊重天性」间摇摆 }
    evidence:
      - source: 澎湃/路桥妇联（高质量陪伴）
        source_type: other
        date: 2021-04-12
        claim: 固定时间（睡前）+仪式感让阅读成为习惯；成人的榜样示范是关键（父母先远离手机）
        confidence: low
    content_gap: 把"习惯=固定时间+仪式+榜样"讲成家庭养育框架
    candidate_angles: [仪式化习惯养成, 榜样机制]

