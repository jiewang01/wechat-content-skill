article_brief:
  account: { positioning: 留学申请规划指南，从选校到文书完整攻略, audience: 大学生/家庭, value_proposition: [全流程攻略, 一手经验] }
  selected_topic: { topic: 2027Fall 选校逻辑重写：新政下的赛道分化, angle: 政策-赛道-决策框架, confidence: high }
  target_reader: 准备 2027Fall、正在按旧经验选校的学生与家庭
  pain_points: { functional: 各国政策突变不知道按什么选校, cognitive: 新旧信息打架判断不了, risk: 选错赛道浪费一年, emotional: 被「拒签率 35%」吓得不敢报 }
  core_insight:
    misconception: 大多数申请者仍用"排名+往年录取经验"选校，忽略政策变量的系统影响
    evidence: ["加拿大学签配额 29万→15.5万、担保金翻倍（新东方 2026-08-28）", "UCAS 中国申请 +12.2%、高选拔院校集中 72% 国际申请（British Council 2026-07-23）", "港新咨询量 +52% vs 英美 -18%（行业统计）"]
    insight: 选校的本质是赛道决策：政策收紧会改录取结构，语境上"主流收紧、新兴放宽"的分化要求用政策-成本-就业三维替代单一排名
  key_arguments: [政策是选校的新第一变量, 分化格局的三维决策表, 数据（配额/拒签率/录取集中度）可量化, 给不同预算与风险的 3-4 套组合]
  title_candidates: ["2027Fall 选校逻辑：新政下的赛道分化", "学签配额减半，加拿大还去吗", "别再用旧经验选校了：2026 新政盘点", "留学赛道大洗牌：谁收紧、谁放宽"]
  outline:
    - { section: Hook, purpose: 抛出新政冲击, key_points: [配额腰斩的震惊数据, 申请者群里的恐慌] }
    - { section: Problem, purpose: 说明旧逻辑失效, key_points: [按排名选校的老方法撞上新政策, 同质化申请泛滥] }
    - { section: Misconception, purpose: 破除「只盯排名」直觉, key_points: [政策改变录取结构, 湾区-成本-就业变量] }
    - { section: Core Insight, purpose: 提出三维决策框架, key_points: [政策风险/预算成本/职业收益, 赛道分化图] }
    - { section: Mechanism, purpose: 讲清各国新政机制, key_points: [配额/担保金/工签/审核标准, 收敛与放宽的供需逻辑] }
    - { section: Solution, purpose: 给选校组合, key_points: [保守/均衡/进取三套组合, 新兴赛道（港新德马）适配画像] }
    - { section: Example, purpose: 一个真实改选案例, key_points: [从加拿大改道香港的决策复盘, 成本与风险对比] }
    - { section: Action, purpose: 本周可做, key_points: [更新目标国政策清单, 用三维表重排 10 所学校, 标记签证风险项] }
  evidence:
    - { source: 新东方前途出国, source_type: other, date: 2026-08-28, claim: 全球新政落地：加拿大配额减半、担保金翻倍等, confidence: medium }
    - { source: British Council/UCAS, source_type: analytics, date: 2026-07-23, claim: 国际本科申请 148,350（+7.1%），中国 +12.2%, confidence: high }