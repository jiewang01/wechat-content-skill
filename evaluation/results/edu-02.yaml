research_findings:
  - topic: 2026 全球留学新政：主流收紧、新兴放宽
    signals: { trend: 2026 下半年英美澳加集中收紧，港新德释放利好, demand: 2027Fall 申请者选校逻辑被颠覆 }
    evidence:
      - source: 新东方前途出国（2026 全球留学新政盘点）
        source_type: other
        date: 2026-08-28
        claim: 加拿大学签年度配额从 29 万份减至 15.5 万、担保金从 1 万加元升至 20635 加元；英美澳加集体抬高门槛，港/新/德放宽；2027Fall 拒签率预计 35%+
        confidence: medium
      - source: 新东方前途出国（2026 秋季入学趋势）
        source_type: other
        date: 2026-09-11
        claim: 2025-2026 申请季全美本科申请量同比增长 9%，Common App 新注册者 +16.43%，头部院校国际生录取率不足 4%
        confidence: medium
      - source: British Council/UCAS 数据
        source_type: analytics
        date: 2026-07-23
        claim: 2026 周期 UCAS 国际本科申请 148,350 人（+7.1%，超 2020 峰值）；中国 +12.2% 居首；高要求院校国际申请 +8.2%，72% 国际申请集中于高选拔院校
        confidence: high
    content_gap: 把"政策分散变化"整合成选校决策逻辑的内容
    candidate_angles: [2027Fall 选校逻辑重写, 新兴赛道红利]

  - topic: 申请竞争维度升级：从材料到规划
    signals: { trend: 录取逻辑转向「前置规划+差异化」, demand: 同质化材料泛滥，普通背景压力大 }
    evidence:
      - source: 中国教育在线/及第留学行业观察（头条）
        source_type: other
        date: 2025-03-01
        claim: 72.3% 申请者看重"申请逻辑与决策依据"，68.7% 将职业发展纳入目标；TOP30 招生官年均审阅超 5000 份，对套路化文书识别度高
        confidence: medium
      - source: 启德《2026 中国留学白皮书》（中国日报）
        source_type: analytics
        date: 2026-03-14
        claim: 硕士申请占 83.59%；理工/医科申请持续上升，商科人文回落；美国前 50 与加拿大医博类录取者 GPA 超半数 ≥86
        confidence: medium
    content_gap: 普通背景（双非/低GPA）如何差异化的可执行内容
    candidate_angles: [普通背景差异化, 文书反套路]

  - topic: 录取结构的分化数据
    signals: { trend: 申请集中度高选拔院校，GPA 梯次分化明显, demand: 申请者想要可对标的"数据标尺" }
    evidence:
      - source: British Council/UCAS 数据
        source_type: analytics
        date: 2026-07-23
        claim: 国际申请 72% 集中于高要求院校（high-tariff），其国际申请 +8.2% 而低要求院校 -3.3%；申请持续向上集中
        confidence: high
      - source: 启德《2026 中国留学白皮书》（中国日报）
        source_type: analytics
        date: 2026-03-14
        claim: 美国 US News 前 50 与加拿大医博类超半数录取者 GPA≥86；英国 QS 前 100 与香港八大约半数 GPA 在 80-85
        confidence: medium
    content_gap: 把录取数据做成"按目标院校层级对标 GPA/背景"的工具型内容
    candidate_angles: [GPA 梯次对标, 高选拔集中度解读]

