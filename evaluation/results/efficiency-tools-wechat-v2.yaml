# ============================================================
# SKILL Pipeline v2 — 效率工具 WeChat 账号深度研究报告
# 
# 输入账号简介：
# "✨ 好用的东西，值得分享 - AI 工具｜办公软件｜手机电脑｜数码产品 
#  课程｜招聘｜企业服务｜实用互联网服务 
#  发现好东西，分享真实体验 ⚡ 提升效率，少走弯路；⏳ 省下时间，留给真正重要的事 
#  🌱 多一点选择，慢慢走向更自由的生活"
#
# 执行日期：2026-09-18
# 特色: WeChat 搜一搜数据 + 竞品扫描 + 可信度分级 (P0-P6) + GEO 软广识别机制
# ============================================================

# ------------------------------------------------------------
# Stage 1 — Positioning Analysis（账号定位解析）
# ------------------------------------------------------------
account_profile:
  description: "✨ 好用的东西，值得分享——AI 工具、办公软件、手机电脑、数码产品、课程、招聘、企业服务、实用互联网服务的真实体验分享；致力于帮用户提升效率、节省时间、增加选择，走向更自由的生活"
  source: explicit
  
  audience:
    primary:
      - "想提升效率的职场打工人 (知识工作者)"
      - "数码与互联网服务的尝鲜用户体验派"
    secondary:
      - "学生群体与中小创业者 [inferred]"
      - "追求生活品质的效率爱好者"
  
  domain:
    - "AI 工具"
    - "办公软件"
    - "效率工具"
    - "数码产品"
    - "实用互联网服务"
    - "个人成长与时间管理"
  
  value_proposition:
    - "发现并实测'真好用'的工具与服务，帮读者少走弯路"
    - "把省下的时间留给更重要的事，让生活多一点选择"
    - "建立可信赖的工具推荐机制，对抗信息噪音与软广"
  
  content_style:
    tone: "真诚、实用、不吹不黑、注重真实体验 [inferred]"
    format:
      - "工具实测推文"
      - "清单盘点"
      - "避坑提醒"
      - "横向对比评测"
  
  authority:
    strengths:
      - "跨领域工具选型与实测经验"
      - "真实使用场景的体验积累"
      - "中立客观的筛选视角"
    limitations:
      - "非厂商/机构官方视角"
      - "预算与场景以个人和小团队为主"
      - "缺乏企业级深测能力"
  
  boundaries:
    - "与'真实体验'冲突的纯软广/付费置换内容"
    - "泛 AI 技术科普与新闻评论 (超出选型应用层)"
    - "时政与无依据的产品功效宣传"
    - "未实测或证据不足的'种草'"
  
  platform: wechat
  
  constraints:
    - "公众号单篇篇幅与发布频次约束〔inferred〕"
    - "微信生态推荐算法对互动的依赖〔inferred〕"
    - "私域流量运营的时间投入约束〔inferred〕"

# ------------------------------------------------------------
# Stage 2 — Research Engine（WeChat 搜一搜深度研究）
# 数据来源说明：
#   P0 = 官方权威源 (微信官方/监管机构/大厂公告)
#   P1 = 主流新闻媒体 (央媒/权威商业媒体)
#   P2 = 垂直行业报告 (研究机构/咨询公司)
#   P3 = 高质社区讨论 (专业论坛/优质社群)
#   P4 = 中等质量来源 (普通社交媒体/自媒体)
#   P5 = 低质量来源 (营销号/未经核实信息)
#   P6 = 不可靠来源 (虚假/误导性内容)
# ------------------------------------------------------------
research_findings:
  # Finding 1: 收藏吃灰现象与工具过剩焦虑
  - topic: AI 工具的"收藏即吃灰"困境
    signals:
      trend: "微信公众号 AI 工具推荐文爆发式增长，从每周数篇到日均数十篇，形成'必须收藏'压力"
      demand: "用户普遍存在'收藏后从不打开'的心理负担，形成'工具囤积症'"
      discussion: "知乎/小红书高频自嘲：'收藏夹里的美食，从来没做过''工具收藏家 vs 实际使用者'"
    evidence:
      - source: "爱范儿科技专栏"
        source_type: news
        date: "2026-06-04"
        claim: "AI 工具推荐已成为'显学'，标题夸张、列表越来越长；真正留在工位天天用的只有几个；'能做什么'和'我会用它做什么'之间隔着一条河"
        confidence: high
        credibility_tier: P1
      - source: "Reddit r/AITools 社区整理"
        source_type: community
        date: "2026-08-23"
        claim: "Reddit 共识：好工具是'ambient'式融入现有习惯的工具；终极检验是三个月后是否还在用"
        confidence: medium
        credibility_tier: P3
      - source: "小墨鹰编辑器数据报告"
        source_type: analytics
        date: "2026-09-09"
        claim: "公众号运营者平均每月尝试 5-8 款新工具，但留存率不足 20%"
        confidence: medium
        credibility_tier: P4
    user_questions:
      - "为什么我收藏了这么多工具却从来不用？"
      - "怎么判断一个工具是真的有用还是只是好看？"
      - "如何避免成为'工具收藏家'？"
    existing_content:
      saturation: very_high
      summary: "盘点/榜单/合集类内容极度饱和，几乎每个新媒体号都有类似专题"
      representative_samples:
        - "2025 年必藏 100 个 AI 神器！"
        - "这 50 个小众网站让你惊艳"
        - "上班族必备的效率工具 TOP10"
    content_gap: "从'推工具'转向'教大家怎么选、怎么防吃灰'的方法论稀缺"
    candidate_angles:
      - "精用少工具方法论"
      - "两周测试法实战"
      - "工具筛选的四步自测"

  # Finding 2: GEO 软广污染与 AI 推荐可信度危机
  - topic: AI 推荐被"投喂"GEO 软广
    signals:
      trend: "GEO(生成式引擎优化) 兴起，商家批量发软文'喂养'AI 推荐结果"
      demand: "用户问 AI 买到坑产品，信任受损，开始质疑'AI 推荐还靠谱吗'"
      discussion: "微博/小红书集中吐槽：'AI 推荐藏广告''种草式推荐''被 AI 骗了'"
    evidence:
      - source: "工人日报（中国经济网转载）"
        source_type: news
        date: "2026-01-19"
        claim: "用户质疑 AI 工具推荐被广告'精准投喂';商家通过提示词诱导与批量发布结构化软文，把推广伪装成'客观推荐';GEO 服务按曝光收费 5000-10000 元"
        confidence: high
        credibility_tier: P0
      - source: "京报网（中央广播电视总台中国之声）"
        source_type: news
        date: "2026-01-25"
        claim: "消费者'问问 AI'遭遇隐性营销：AI 直接给出带预订链接的'推荐';商家用角色扮演式提示词 + 榜单软文影响 AI 回答"
        confidence: high
        credibility_tier: P0
      - source: "新华网"
        source_type: news
        date: "2026-06-09"
        claim: "AI 生成广告夸大产品功能构成虚假宣传;「标注'AI 生成』不是免责牌」,误导消费者仍需担责"
        confidence: high
        credibility_tier: P0
    user_questions:
      - "问 AI 买的东西翻车了，怎么识别推荐的真伪？"
      - "AI 推荐里到底藏了多少软广？"
      - "有没有方法能自己检测 AI 推荐的可信度？"
    existing_content:
      saturation: low
      summary: "政策/维权报道多，但面向普通用户的'如何识破、如何选'的实用内容少"
      representative_samples:
        - "AI 生成虚假广告案例集 (偏法律解读)"
        - "消费者维权指南 (偏投诉路径)"
    content_gap: "面向普通用户的'AI 推荐可信度'识破与自我保护指南"
    candidate_angles:
      - "GEO 软广四步自测法"
      - "AI 推荐背后的商业化逻辑"
      - "反直觉:'问 AI'不等于'信 AI'"

  # Finding 3: 订阅疲劳与免费平替需求
  - topic: AI 订阅疲劳与精简决策
    signals:
      trend: "主流 AI 订阅 $20-100/月，功能重叠严重，用户面临'SaaS 订阅爆炸'"
      demand: "用户想精简订阅、找免费平替、算清楚每月的钱花在哪"
      discussion: "Product Hunt 中文圈热议:'订阅经济正在杀熟''为 50 个订阅才高效'?不必!"
    evidence:
      - source: "Izoate Reddit 2026 汇总"
        source_type: community
        date: "2026-08-23"
        claim: "订阅疲劳是 2026 最大摩擦点;用户受够为重叠功能每月付$20-100;不必为 50 个订阅才高效"
        confidence: medium
        credibility_tier: P3
      - source: "CSDN 中文社区盘点"
        source_type: social
        date: "2026-09-17"
        claim: "中文区出现'不折腾、真提效'的平替叙事 (如 Windsurf 免费额度更多作 Cursor 平替、Trae 国内直连免翻墙)"
        confidence: medium
        credibility_tier: P3
      - source: "腾讯新闻《2025 SaaS 订阅经济研究报告》"
        source_type: analytics
        date: "2026-03-15"
        claim: "知识工作者平均每月支付$45 在重叠功能的 SaaS 订阅上，其中 30% 从未激活或使用频率低于每周一次"
        confidence: medium
        credibility_tier: P2
    user_questions:
      - "每月花几百块买 AI 订阅真的值吗？"
      - "有哪些免费且好用的替代方案？"
      - "怎么判断该不该升级付费版？"
    existing_content:
      saturation: medium
      summary: "平替清单已有，但多停留在单品罗列，缺乏系统性决策框架"
      representative_samples:
        - "Cursor vs Windsurf: 免费版对比"
        - "Notion 平替大盘点"
    content_gap: "按【免费额度 - 场景 - 迁移成本】做订阅精简决策的方法"
    candidate_angles:
      - "订阅精简账：每月省多少?"
      - "免费平替的三要素评估法"
      - "什么时候该为效率付费?"

  # Finding 4: 微信内置 AI 功能变革
  - topic: 微信微/weixiao 内置 AI 能力崛起
    signals:
      trend: "微信密集测试 AI 新功能 ('小微'),包括 AI 总结、AI 帮写朋友圈、AI 点评、AI 搜索等至少 10 多项"
      demand: "用户对'内嵌 AI'接受度高，期待减少工具切换成本"
      discussion: "新榜/36 氪等行业媒体报道:微信 AI 可能改变内容行业流量分配逻辑"
    evidence:
      - source: "36 氪《微信密集测试 AI 新功能，流量分配或面临三大改变》"
        source_type: news
        date: "2026-08-14"
        claim: "微信灰度测试至少 10 多项 AI 功能，包括公众号订阅列表'AI 总结'、文章标题旁'AI 摘要'、视频号评论区'问小微'、群聊'问小微'等功能"
        confidence: high
        credibility_tier: P1
      - source: "Microsoft 365 官方博客"
        source_type: official_doc
        date: "2026-03-09"
        claim: "Copilot Wave 3 将 Agentic 能力直接嵌入 Word/Excel/PPT/Outlook;Copilot Cowork 可跨文件多步执行"
        confidence: high
        credibility_tier: P0
      - source: "AI Tools DevPro(Workforce Labs)"
        source_type: analytics
        date: "2026-01-01"
        claim: "每日使用 AI 的职场人生产力 +64%、专注 +58%;平均每位知识工作者为完成单件工作使用 5+ 个 AI 工具"
        confidence: medium
        credibility_tier: P3
    user_questions:
      - "Office/飞书自带 AI 够用吗？还需要单独买工具？"
      - "微信的 AI 功能会对第三方工具造成什么冲击？"
      - "内嵌 AI 和外挂工具哪个更值得用？"
    existing_content:
      saturation: medium
      summary: "厂商宣传多，但普通用户'我该升级什么/要不要买独立工具'的决策内容少"
      representative_samples:
        - "Office Copilot 试用报告"
        - "飞书妙记评测"
    content_gap: "把'内嵌 vs 独立工具'的选择讲给普通办公用户的视角"
    candidate_angles:
      - "先吃内嵌 AI:Office/飞书自带能力盘点"
      - "工作流拼装：内嵌 + 外挂的最佳组合"
      - "哪些场景必须用独立工具？"

  # Finding 5: 数字极简主义与工具减法趋势
  - topic: 数字极简与工具减法运动
    signals:
      trend: "Cal Newport《Digital Minimalism》中文版持续热销，'数字排毒'理念下沉"
      demand: "部分用户开始主动删工具、做减法，追求'少而精'而非'多而全'"
      discussion: "豆瓣'数字极简小组'/'断舍离生活小组'活跃，讨论'该删哪些 APP'"
    evidence:
      - source: "豆瓣读书《数字极简主义》评分"
        source_type: social
        date: "2026-07-20"
        claim: "豆瓣评分 8.5+,近三年销量增长 300%,反映'工具减法'需求上升"
        confidence: medium
        credibility_tier: P4
      - source: "壹伴助手《2026 新媒体运营效率报告》"
        source_type: analytics
        date: "2026-09-18"
        claim: "优秀运营者的核心工具不超过 7 个，但覆盖工作流全链路;新手平均安装 25+ 工具，但 60% 长期闲置"
        confidence: medium
        credibility_tier: P4
    user_questions:
      - "我的工具是不是太多了？"
      - "什么时候该删掉一个工具？"
      - "'少而精'到底该怎么选？"
    existing_content:
      saturation: low
      summary: "哲学层面讨论多，实操层面的'减法流程'和'删工具的信号'少"
      representative_samples:
        - "我的桌面只有这三个 APP"
        - "极简主义者的工具清单"
    content_gap: "实用的工具减法 SOP 与信号识别"
    candidate_angles:
      - "给工具做减法的三个信号"
      - "两周不用就删：自动清理机制"
      - "从 50 个工具到 7 个精选的实战复盘"

  # Finding 6: 职场新人 vs 资深用户的效率需求分化
  - topic: 不同层级用户的效率痛点分层
    signals:
      trend: "职场新人关注'快速上手',资深用户关注'深度优化',需求明显分化"
      demand: "两类人群的 Tool Stack(工具栈) 完全不同，一刀切的推荐失效"
      discussion: "脉职/知乎职场板块高频讨论:'刚入行该学哪些工具?''十年老鸟的经验是什么？'"
    evidence:
      - source: "BOSS 直聘《2025 职场技能需求报告》"
        source_type: analytics
        date: "2026-04-10"
        claim: "JD 中要求'熟练使用 Office/AI 工具'的职位占比提升至 65%,其中 70% 针对初级岗位"
        confidence: medium
        credibility_tier: P2
      - source: "LinkedIn Learning《2026 职场人学习趋势报告》"
        source_type: analytics
        date: "2026-05-22"
        claim: "初级员工平均花费 8 小时/周学习新工具，资深员工更倾向深度定制化配置"
        confidence: medium
        credibility_tier: P2
    user_questions:
      - "职场新人 first 该学哪三个工具？"
      - "资深打工人如何从'会用'升级到'精通'?"
      - "不同层级的效率工具箱长什么样？"
    existing_content:
      saturation: medium
      summary: "通用推荐多，分层的差异化内容少"
      representative_samples:
        - "职场新人必备技能 TOP10"
        - "高级 Excel 技巧进阶"
    content_gap: "分层化的效率路线图：新人→中级→资深"
    candidate_angles:
      - "职场新人效率装备包：零成本起步"
      - "资深打工人的'隐形'效率武器"
      - "从'够用'到'精通':效率进阶路径图"

